        /* ============================================================
         *  CUADRO DE ELIMINACIÓN (Playoff / Copa de Oro / Copa de Plata)
         * ============================================================ */
        const NOMBRES_RONDA = {
            octavos: 'Octavos de final',
            cuartos: 'Cuartos de final',
            semifinal: 'Semifinal',
            final: 'Final',
            otra: 'Otros',
        };
        const ORDEN_RONDAS = ['octavos', 'cuartos', 'semifinal', 'final', 'otra'];

        function renderBracketFase(categoria, fase) {
            const partidosFase = filtrarPorTemporada(PARTIDOS).filter(
                (p) => p.categoria === categoria && normalizarFase(p.fase) === fase
            );
            if (!partidosFase.length) return '';

            const porRonda = new Map();
            partidosFase.forEach((p) => {
                const { ronda } = analizarRondaBracket(p.etiqueta_fecha || p.fecha_nro);
                if (!porRonda.has(ronda)) porRonda.set(ronda, []);
                porRonda.get(ronda).push(p);
            });

            const rondas = Array.from(porRonda.keys()).sort((a, b) => ORDEN_RONDAS.indexOf(a) - ORDEN_RONDAS.indexOf(b));

            let html = `<h3 class="text-xs font-semibold text-texto uppercase tracking-wide px-1 mt-5 mb-2">${escaparHtml(fase)}</h3>`;
            let banner = '';

            rondas.forEach((ronda) => {
                const cruces = agruparCruces(porRonda.get(ronda));
                html += `
      <p class="text-[10px] text-muted uppercase tracking-wide px-1 mb-1.5">${NOMBRES_RONDA[ronda] || ronda}</p>
      <div class="space-y-2 mb-3">${cruces.map(tarjetaCruce).join('')}</div>
    `;

                if (ronda === 'final' && cruces.length === 1 && cruces[0].definido) {
                    const c = cruces[0];
                    const ganador = c.ganadorA ? c.equipoA : c.equipoB;
                    const idGanador = c.ganadorA ? c.idA : c.idB;
                    const clave = `${categoria}|${TEMPORADA_ACTIVA}|${fase}`;
                    CAMPEONES_TEMPORADA[clave] = { id: idGanador, nombre: ganador.nombre, categoria, temporada: TEMPORADA_ACTIVA, fase };

                    const esAscenso = tieneAscenso(categoria);
                    banner = `
        <div class="bg-accent/10 border border-accent/30 rounded-2xl px-4 py-3 mb-4 flex items-center gap-3">
          <span class="text-2xl">🏆</span>
          <p class="text-sm font-semibold text-texto">${esAscenso ? 'Asciende' : 'Campeón'}: ${escaparHtml(ganador.nombre)}</p>
        </div>
      `;
                }
            });

            return html + banner;
        }

        function agruparCruces(partidos) {
            const cruces = new Map();
            partidos.forEach((p) => {
                const clave = [String(p.id_local), String(p.id_visitante)].sort().join('_');
                if (!cruces.has(clave)) cruces.set(clave, []);
                cruces.get(clave).push(p);
            });
            return Array.from(cruces.entries()).map(([clave, lista]) => {
                lista.sort((a, b) => Number(a.fecha_nro) - Number(b.fecha_nro));
                const claveUnica = clave + '__' + lista.map((p) => p.fecha_nro).join('-');
                CRUCES_INDEX.set(claveUnica, lista);
                const c = construirCruce(lista);
                c.claveCruce = claveUnica;
                return c;
            });
        }

        function construirCruce(partidosDelCruce) {
            const idsEquipos = [...new Set(partidosDelCruce.flatMap((p) => [String(p.id_local), String(p.id_visitante)]))];
            const [idA, idB] = idsEquipos;
            const equipoA = equipoInfo(idA);
            const equipoB = equipoInfo(idB);

            let golesA = 0, golesB = 0, jugados = 0;
            partidosDelCruce.forEach((p) => {
                if (normalizarEstado(p.estado) !== 'finalizado') return;
                jugados++;
                const aEsLocal = String(p.id_local) === idA;
                golesA += aEsLocal ? (Number(p.goles_local) || 0) : (Number(p.goles_visitante) || 0);
                golesB += aEsLocal ? (Number(p.goles_visitante) || 0) : (Number(p.goles_local) || 0);
            });

            const totalPartidos = partidosDelCruce.length;
            const definido = jugados === totalPartidos && totalPartidos > 0;

            let ganadorA = definido && golesA > golesB;
            let ganadorB = definido && golesB > golesA;
            let porPenales = false;

            if (definido && golesA === golesB) {
                const ultimo = partidosDelCruce[partidosDelCruce.length - 1];
                const res = determinarGanadorPartido(ultimo);
                if (res.idGanador) {
                    ganadorA = res.idGanador === idA;
                    ganadorB = res.idGanador === idB;
                    porPenales = res.porPenales;
                }
            }

            return { equipoA, equipoB, idA, idB, golesA, golesB, jugados, totalPartidos, definido, ganadorA, ganadorB, porPenales, partidos: partidosDelCruce };
        }

        function tarjetaCruce(c) {
            return `
    <div class="bg-surface border border-borde rounded-xl px-3 py-2.5 cursor-pointer active:opacity-70" data-cruce="${c.claveCruce}">
      <div class="flex items-center justify-between text-xs mb-1.5">
        <div class="flex items-center gap-1.5 min-w-0 ${c.ganadorA ? '' : c.definido ? 'opacity-60' : ''}">
          <img src="${c.equipoA.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(c.equipoA.nombre)}');" class="w-5 h-5 rounded-full object-cover bg-elevado flex-shrink-0"/>
          <span class="truncate ${c.ganadorA ? 'font-semibold text-texto' : 'text-muted'}">${escaparHtml(c.equipoA.nombre)}</span>
        </div>
        <span class="font-mono font-semibold flex-shrink-0 px-2">${c.jugados > 0 ? c.golesA : '-'}</span>
      </div>
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5 min-w-0 ${c.ganadorB ? '' : c.definido ? 'opacity-60' : ''}">
          <img src="${c.equipoB.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(c.equipoB.nombre)}');" class="w-5 h-5 rounded-full object-cover bg-elevado flex-shrink-0"/>
          <span class="truncate ${c.ganadorB ? 'font-semibold text-texto' : 'text-muted'}">${escaparHtml(c.equipoB.nombre)}</span>
        </div>
        <span class="font-mono font-semibold flex-shrink-0 px-2">${c.jugados > 0 ? c.golesB : '-'}</span>
      </div>
      ${c.totalPartidos > 1 || c.porPenales ? `<p class="text-[9px] text-muted text-center mt-1.5">${c.jugados}/${c.totalPartidos} partido(s)${c.definido ? ' · global' : ''}${c.porPenales ? ' · por penales' : ''}</p>` : ''}
    </div>
  `;
        }

        function abrirModalCruceDetalle(clave) {
            const partidos = CRUCES_INDEX.get(clave);
            if (!partidos || !partidos.length) return;

            const idsEquipos = [...new Set(partidos.flatMap((p) => [String(p.id_local), String(p.id_visitante)]))];
            const equipoRef1 = equipoInfo(idsEquipos[0]);
            const equipoRef2 = equipoInfo(idsEquipos[1]);
            const c = construirCruce(partidos);

            document.getElementById('modal-contenido').innerHTML = `
    <div class="flex items-center justify-center gap-4 mb-1">
      <div class="flex flex-col items-center gap-1.5 w-20">
        <img src="${equipoRef1.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(equipoRef1.nombre)}');" class="w-12 h-12 rounded-xl object-cover bg-elevado"/>
        <span class="text-[11px] text-center leading-tight">${escaparHtml(equipoRef1.nombre)}</span>
      </div>
      
<div class="flex flex-col items-center flex-shrink-0">
        ${c.jugados > 0 ? `<span class="font-mono text-lg font-semibold text-texto">${c.golesA} - ${c.golesB}</span>` : ''}
        ${c.totalPartidos > 1 || c.porPenales ? `<span class="text-[9px] text-muted uppercase mt-0.5">global${c.porPenales ? ' · penales' : ''}</span>` : ''}
      </div>

      <div class="flex flex-col items-center gap-1.5 w-20">
        <img src="${equipoRef2.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(equipoRef2.nombre)}');" class="w-12 h-12 rounded-xl object-cover bg-elevado"/>
        <span class="text-[11px] text-center leading-tight">${escaparHtml(equipoRef2.nombre)}</span>
      </div>
    </div>
    <h3 class="text-[11px] uppercase tracking-wide text-muted font-semibold mb-2 mt-3 text-center">Serie</h3>
    <div class="space-y-2">${partidos.map(filaLegCruce).join('')}</div>
  `;
            document.getElementById('modal-equipo').classList.remove('hidden');
        }

        function formatGolConPenal(goles, penales) {
            const g = Number(goles) || 0;
            if (penales !== undefined && penales !== null && penales !== '') {
                return `${g} (${Number(penales)})`;
            }
            return `${g}`;
        }

        function filaLegCruce(p) {
            const local = equipoInfo(p.id_local);
            const visitante = equipoInfo(p.id_visitante);
            const tienePenales = p.penales_local !== undefined && p.penales_local !== null && p.penales_local !== '' &&
                p.penales_visitante !== undefined && p.penales_visitante !== null && p.penales_visitante !== '';
            const tag = tienePenales ? 'AP' : 'FT';

            return `
    <div class="flex items-center gap-2 text-xs bg-elevado/40 rounded-xl px-3 py-2">
      <span class="text-[10px] text-muted font-mono flex-shrink-0 w-12">${formatearFechaCorta(p.fecha)}</span>
      <img src="${local.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(local.nombre)}');" class="w-5 h-5 rounded-full object-cover bg-elevado flex-shrink-0"/>
      <span class="truncate flex-1">${escaparHtml(local.nombre)}</span>
      <span class="font-mono font-semibold flex-shrink-0">${formatGolConPenal(p.goles_local, p.penales_local)}</span>
      <span class="text-muted flex-shrink-0">-</span>
      <span class="font-mono font-semibold flex-shrink-0">${formatGolConPenal(p.goles_visitante, p.penales_visitante)}</span>
      <span class="truncate flex-1 text-right">${escaparHtml(visitante.nombre)}</span>
      <img src="${visitante.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(visitante.nombre)}');" class="w-5 h-5 rounded-full object-cover bg-elevado flex-shrink-0"/>
      <span class="text-[9px] text-muted font-mono flex-shrink-0 w-6 text-right">${tag}</span>
    </div>
  `;
        }

        function filaTabla(f, posicion, umbralDescenso) {
            const colorDif = f.dif > 0 ? 'text-accent' : f.dif < 0 ? 'text-live' : 'text-muted';
            const dataAttr = f.id != null ? `data-equipo-id="${f.id}"` : '';
            const esDescenso = umbralDescenso != null && posicion > umbralDescenso;
            const filaClase = esDescenso ? 'bg-live/5' : '';
            const posicionClase = esDescenso ? 'text-live font-semibold' : 'text-muted';

            return `
    <tr class="border-b border-borde last:border-0 cursor-pointer active:bg-elevado/60 align-middle ${filaClase}" ${dataAttr}>
      <td class="py-2 pl-1 font-mono text-[10px] ${posicionClase}">${posicion}</td>
      <td class="py-2 pr-1">
        <div class="flex items-center gap-1 min-w-0">
          <img src="${f.equipo.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(f.equipo.nombre)}');" class="w-4 h-4 rounded-full object-cover bg-elevado flex-shrink-0" alt=""/>
          <span class="text-[10px] leading-tight break-words capitalize ${esDescenso ? 'text-live' : ''}">${escaparHtml(f.equipo.nombre)}</span>
        </div>
      </td>
      <td class="py-2 text-center font-mono text-[10px] text-muted">${f.pj}</td>
      <td class="py-2 text-center font-mono text-[10px] text-muted">${f.pg}</td>
      <td class="py-2 text-center font-mono text-[10px] text-muted">${f.pe}</td>
      <td class="py-2 text-center font-mono text-[10px] text-muted">${f.pp}</td>
      <td class="py-2 text-center font-mono text-[10px] text-muted">${f.gf}</td>
      <td class="py-2 text-center font-mono text-[10px] text-muted">${f.gc}</td>
      <td class="py-2 text-center font-mono text-[10px] ${colorDif}">${f.dif > 0 ? '+' : ''}${f.dif}</td>
      <td class="py-2 pr-1 text-right font-mono text-[11px] font-semibold">${f.pts}</td>
    </tr>
  `;
        }

        /* ============================================================
         *  VISTA: EQUIPOS — LISTADO ÚNICO POR CLUB
         * ============================================================ */
        function normalizarClub(nombre) {
            return String(nombre || '').trim().toLowerCase();
        }

        function claveClub(equipo) {
            return equipo.id_club ? ('club_' + String(equipo.id_club).trim().toLowerCase()) : normalizarClub(equipo.nombre);
        }

        function parsearTorneoYAnio(texto) {
            const match = String(texto || '').match(/(\d{4})\s*$/);
            if (match) {
                const anio = match[1];
                const fase = texto.replace(match[0], '').trim();
                return { fase: fase || 'Campeón', temporada: anio };
            }
            return { fase: texto, temporada: '' };
        }

        function buscarEquipoPorIdClub(idClub) {
            return EQUIPOS.find((e) => e.id_club && String(e.id_club).trim().toLowerCase() === String(idClub).trim().toLowerCase());
        }

        function cargarFavoritos() {
            try {
                const raw = localStorage.getItem('favoritos_clubes');
                FAVORITOS = new Set(raw ? JSON.parse(raw) : []);
            } catch (e) { FAVORITOS = new Set(); }
        }

        function guardarFavoritos() {
            try { localStorage.setItem('favoritos_clubes', JSON.stringify([...FAVORITOS])); } catch (e) { }
        }

        function esFavorito(equipo) {
            return FAVORITOS.has(claveClub(equipo));
        }

        let CLUB_PENDIENTE_DESFAV = null;

        function toggleFavorito(equipo, alConfirmar) {
            const clave = claveClub(equipo);
            if (FAVORITOS.has(clave)) {
                CLUB_PENDIENTE_DESFAV = { equipo, alConfirmar };
                const modal = document.getElementById('modal-confirmar-desfav');
                document.getElementById('confirmar-desfav-texto').textContent = `¿Estás seguro que deseas sacar a ${equipo.nombre} de tus favoritos?`;
                modal.style.zIndex = '999999';
                modal.style.position = 'fixed';
                modal.style.display = 'flex';
                modal.classList.remove('hidden');
            } else {
                FAVORITOS.add(clave);
                guardarFavoritos();
                if (alConfirmar) alConfirmar();
            }
        }

        function cerrarConfirmarDesfav() {
            const modal = document.getElementById('modal-confirmar-desfav');
            modal.classList.add('hidden');
            modal.style.display = '';
            CLUB_PENDIENTE_DESFAV = null;
        }

        function confirmarDesfavorito() {
            if (!CLUB_PENDIENTE_DESFAV) return;
            const { equipo, alConfirmar } = CLUB_PENDIENTE_DESFAV;
            FAVORITOS.delete(claveClub(equipo));
            guardarFavoritos();
            const modal = document.getElementById('modal-confirmar-desfav');
            modal.classList.add('hidden');
            modal.style.display = '';
            CLUB_PENDIENTE_DESFAV = null;
            if (alConfirmar) alConfirmar();
        }

        function familiaCategoria(categoria) {
            return String(categoria || '').trim().replace(/\s+[AB]$/i, '').toLowerCase();
        }

        function equiposDelClub(equipoReferencia) {
            const clave = claveClub(equipoReferencia);
            return EQUIPOS.filter((e) => claveClub(e) === clave);
        }

        function obtenerClubsUnicos() {
            const vistos = new Set();
            const resultado = [];
            EQUIPOS.forEach((e) => {
                const clave = claveClub(e);
                if (!vistos.has(clave)) {
                    vistos.add(clave);
                    resultado.push(e);
                }
            });
            return resultado;
        }

        let FILTRO_EQUIPOS = '';

        function renderEquipos() {
            const contenedor = document.getElementById('vista-contenido');
            const clubs = obtenerClubsUnicos().filter((c) =>
                normalizarClub(c.nombre).includes(normalizarClub(FILTRO_EQUIPOS))
            );

            const tip = tipOnboarding('equipos', 'Buscá tu equipo favorito para ver sus estadísticas y alineaciones.');
            const medallero = bloqueMedallero();

            contenedor.innerHTML = `
    ${medallero}
    <input id="buscador-equipos" type="text" value="${escaparHtml(FILTRO_EQUIPOS)}" placeholder="Buscar equipo…" class="w-full bg-elevado border border-borde rounded-xl px-3 py-2.5 text-sm text-texto placeholder:text-muted mb-1"/>
    ${tip}
    ${clubs.map(tarjetaEquipo).join('') || `<p class="text-center text-muted text-sm py-16">No se encontraron equipos.</p>`}
  `;

            const input = document.getElementById('buscador-equipos');
            input.addEventListener('input', (e) => {
                FILTRO_EQUIPOS = e.target.value;
                renderEquipos();

                nuevo.setSelectionRange(nuevo.value.length, nuevo.value.length);

        function tarjetaEquipo(equipo) {
            const hermanos = equiposDelClub(equipo);
            const categoriasUnicas = [...new Set(hermanos.map((h) => h.categoria))];
            const tieneColores = equipo.color_principal || equipo.color_secundario;
            const dataAttr = equipo.id_equipo != null ? `data-equipo-perfil="${equipo.id_equipo}"` : '';
            return `

        src="${equipo.url_escudo || ''}"

        alt="${escaparHtml(equipo.nombre)}"
      />

          ${categoriasUnicas.map((c) => `<span class="bg-elevado text-[9px] font-semibold text-muted uppercase px-2 py-0.5 rounded-full">${escaparHtml(c)}</span>`).join('')}
        </div>

          <div class="flex items-center gap-1.5 mt-2">

            ${equipo.color_secundario ? `<span class="w-4 h-4 rounded-full border border-borde" style="background:${escaparColor(equipo.color_secundario)}"></span>` : ''}

      ${equipo.url_camiseta ? `<img src="${equipo.url_camiseta}" class="w-12 h-14 object-contain flex-shrink-0" alt="Camiseta ${escaparHtml(equipo.nombre)}"/>` : ''}
    </article>
  `;
        }

        function escaparColor(valor) {
            const limpio = String(valor || '').trim();
            if (/^#[0-9a-fA-F]{3,8}$/.test(limpio) || /^[a-zA-Z]+$/.test(limpio)) return limpio;
            return '#1A2230';
        }

        /* ============================================================
         *  MODAL: FORMA DE UN EQUIPO (desde Tabla)
         * ============================================================ */
        function calcularForma(idEquipo) {
            const idStr = String(idEquipo);

            return PARTIDOS
                .filter(
                    (p) =>
                        (String(p.id_local) === idStr || String(p.id_visitante) === idStr) &&
                        normalizarEstado(p.estado) === 'finalizado'
                )
                .sort((a, b) => {
                    const porTemporada = String(b.temporada || '').localeCompare(String(a.temporada || ''), undefined, { numeric: true });
                    if (porTemporada !== 0) return porTemporada;
                    return Number(b.fecha_nro) - Number(a.fecha_nro);
                })
                .slice(0, 5)
                .map((p) => {
                    const esLocal = String(p.id_local) === idStr;
                    const propios = esLocal ? Number(p.goles_local) || 0 : Number(p.goles_visitante) || 0;
                    const rivalGoles = esLocal ? Number(p.goles_visitante) || 0 : Number(p.goles_local) || 0;
                    const rival = equipoInfo(esLocal ? p.id_visitante : p.id_local);
                    let resultado = 'E';
                    if (propios > rivalGoles) resultado = 'G';
                    else if (propios < rivalGoles) resultado = 'P';
                    return { resultado, rival, propios, rivalGoles, esLocal, temporada: p.temporada };
                });
        }

        function etiquetaTemporadaForma(forma) {
            const temporadas = [...new Set(forma.map((f) => f.temporada).filter((t) => t != null && t !== ''))];
            if (!temporadas.length) return '';

            const temporadaMasReciente = obtenerTemporadasDisponibles(CATEGORIA_ACTIVA)[0];
            const esSoloActual = temporadas.length === 1 && String(temporadas[0]) === String(temporadaMasReciente);
            if (esSoloActual) return '';

            temporadas.sort((a, b) => String(b).localeCompare(String(a), undefined, { numeric: true }));
            return ` <span class="normal-case font-normal text-muted">(${temporadas.map((t) => 'Temporada ' + t).join(' / ')})</span>`;

        function abrirModalEquipo(idEquipo) {

        /* ============================================================
         *  MODAL: HISTORIAL CARA A CARA (desde Partidos)

        function calcularHistorialH2H(idLocal, idVisitante) {
            const clubA = claveClub(equipoInfo(idLocal));
            const clubB = claveClub(equipoInfo(idVisitante));
            const familiaRef = familiaCategoria(equipoInfo(idLocal).categoria);

            return PARTIDOS
                .filter((p) => {
                    if (normalizarEstado(p.estado) !== 'finalizado') return false;
                    if (familiaCategoria(p.categoria) !== familiaRef) return false;
                    const clubLocal = claveClub(equipoInfo(p.id_local));
                    const clubVisitante = claveClub(equipoInfo(p.id_visitante));
                    return (clubLocal === clubA && clubVisitante === clubB) || (clubLocal === clubB && clubVisitante === clubA);
                })
                .sort((x, y) => {
                    const porTemporada = String(y.temporada || '').localeCompare(String(x.temporada || ''), undefined, { numeric: true });
                    if (porTemporada !== 0) return porTemporada;
                    return Number(y.fecha_nro) - Number(x.fecha_nro);
                });
        }

    <p class="text-center text-[10px] text-muted uppercase tracking-wide mb-5">${escaparHtml(equipoA.categoria || '')}</p>

        <div><p class="font-mono text-lg font-semibold text-warning">${empates}</p><p class="text-[10px] text-muted uppercase">Empates</p></div>

        function paginarHtml(lista, pagina, renderItem, idPrefijo) {

            return `<div class="space-y-3">${items.map(renderItem).join('')}</div>${paginacion}`;

        function renderPaginaHistorial() {

            const inicio = H2H_PAGINA * H2H_POR_PAGINA;

            document.getElementById('h2h-lista').innerHTML = `<div class="space-y-2">${pagina.map(filaHistorialH2H).join('')}</div>`;

            const paginacion = document.getElementById('h2h-paginacion');
            if (totalPaginas <= 1) {
                paginacion.innerHTML = '';

            }

            function paginarHtml(lista, pagina, renderItem, idPrefijo) {
                const totalPaginas = Math.max(1, Math.ceil(lista.length / FAVORITOS_POR_PAGINA));
                const paginaSegura = Math.min(Math.max(pagina, 0), totalPaginas - 1);
                const inicio = paginaSegura * FAVORITOS_POR_PAGINA;
                const items = lista.slice(inicio, inicio + FAVORITOS_POR_PAGINA);

                const paginacion = totalPaginas > 1 ? `
    <div class="flex items-center justify-between mt-3 mb-2">
      <button onclick="cambiarPaginaFavoritos('${idPrefijo}', -1)" class="p-1.5 text-muted disabled:opacity-25" ${paginaSegura <= 0 ? 'disabled' : ''}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="text-[10px] text-muted uppercase">Página ${paginaSegura + 1} de ${totalPaginas}</span>
      <button onclick="cambiarPaginaFavoritos('${idPrefijo}', 1)" class="p-1.5 text-muted disabled:opacity-25" ${paginaSegura >= totalPaginas - 1 ? 'disabled' : ''}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  ` : '';

                return `<div class="space-y-3">${items.map(renderItem).join('')}</div>${paginacion}`;
            }

            function cambiarPaginaFavoritos(idPrefijo, delta) {
                FAVORITOS_PAGINA += delta;
                renderPartidos();
            }

            paginacion.innerHTML = `

        function cambiarPaginaHistorial(delta) {
            H2H_PAGINA += delta;

        function formatearFechaCorta(fechaIso) {
            if (!fechaIso) return '-';
            const d = new Date(fechaIso + 'T00:00:00');
            return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }).replace('.', '');
        }

        function formatearFechaNumerica(fechaIso) {
            if (!fechaIso) return '';
            const d = new Date(fechaIso + 'T00:00:00');
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yy = String(d.getFullYear()).slice(-2);
            return `${dd}/${mm}/${yy}`;
        }

        function formatearFechaVisual(fechaIso) {
            if (!fechaIso) return '';
            const hoyStr = new Date().toISOString().slice(0, 10);
            const mananaStr = new Date(Date.now() + 86400000).toISOString().slice(0, 10);

            if (fechaIso === hoyStr) return 'Hoy';
            if (fechaIso === mananaStr) return 'Mañana';

            const d = new Date(fechaIso + 'T00:00:00');
            const dia = d.toLocaleDateString('es-AR', { weekday: 'short' }).replace('.', '');
            const diaCapitalizado = dia.charAt(0).toUpperCase() + dia.slice(1);
            return `${diaCapitalizado} ${d.getDate()}/${d.getMonth() + 1}`;
        }

        function filaHistorialH2H(partido) {
            const local = equipoInfo(partido.id_local);
            const visitante = equipoInfo(partido.id_visitante);
            const anioCorto = partido.temporada ? `'${String(partido.temporada).slice(-2)}` : '';
            return `
    <div class="flex items-center justify-between text-xs bg-elevado/40 rounded-xl px-3 py-2 gap-2">
      <span class="text-[10px] text-muted font-mono flex-shrink-0 w-16 truncate">${escaparHtml(etiquetaJornadaPartido(partido))}</span>
      <span class="truncate flex-1 text-right">${escaparHtml(local.nombre)}</span>
      <span class="font-mono font-semibold flex-shrink-0 px-1">${Number(partido.goles_local) || 0}-${Number(partido.goles_visitante) || 0}</span>
      <span class="truncate flex-1">${escaparHtml(visitante.nombre)}</span>
      <span class="text-[10px] text-muted font-mono flex-shrink-0 w-16 text-right">${formatearFechaCorta(partido.fecha)} ${anioCorto}</span>
    </div>
  `;
        }

        /* ============================================================
         *  MODAL: PERFIL DE EQUIPO (desde Equipos)
         * ============================================================ */
        function calcularDashboardEquipoMultiple(ids, temporada) {
            const idsStr = ids.map(String);
            const jugados = PARTIDOS.filter(
                (p) => (idsStr.includes(String(p.id_local)) || idsStr.includes(String(p.id_visitante))) &&
                    normalizarEstado(p.estado) === 'finalizado' &&
                    (!temporada || String(p.temporada) === String(temporada))
            );

            let gf = 0, gc = 0, pg = 0, pe = 0, pp = 0;
            jugados.forEach((p) => {
                const esLocal = idsStr.includes(String(p.id_local));
                const propios = esLocal ? Number(p.goles_local) || 0 : Number(p.goles_visitante) || 0;
                const rival = esLocal ? Number(p.goles_visitante) || 0 : Number(p.goles_local) || 0;
                gf += propios; gc += rival;
                if (propios > rival) pg++;
                else if (propios < rival) pp++;
                else pe++;
            });

            const pj = jugados.length;
            return { pj, pg, pe, pp, gf, gc, promedioGF: pj ? gf / pj : 0, promedioGC: pj ? gc / pj : 0 };
        }

        function abrirModalPerfilEquipo(idEquipo) {
            const equipo = equipoInfo(idEquipo);

        function renderModalPerfilEquipo() {
            const hermanos = equiposDelClub(CLUB_PERFIL_ACTUAL);
            const categoriasDisponibles = [...new Set(hermanos.map((h) => h.categoria))];

            // ids según el filtro de categoría (todas si no hay filtro elegido)
            const filaPorCategoria = hermanos.filter((h) => !PERFIL_FILTRO_CATEGORIA || h.categoria === PERFIL_FILTRO_CATEGORIA);
            const idsPorCategoria = filaPorCategoria.map((h) => String(h.id_equipo));

            // Temporadas REALMENTE jugadas por esos ids, según los partidos —
            // no según la hoja "equipos" — así funciona aunque el club haya
            // mantenido el mismo id_equipo en todos los años.
            const temporadasDisponibles = [...new Set(
                PARTIDOS
                    .filter((p) => idsPorCategoria.includes(String(p.id_local)) || idsPorCategoria.includes(String(p.id_visitante)))
                    .map((p) => p.temporada)
                    .filter((t) => t != null && t !== '')
            )].sort((a, b) => String(b).localeCompare(String(a), undefined, { numeric: true }));

            const referencia = filaPorCategoria[0] || hermanos[0];
            const combinando = idsPorCategoria.length > 1;

            const d = calcularDashboardEquipoMultiple(idsPorCategoria, PERFIL_FILTRO_TEMPORADA);

            const plantillaCruda = idsPorCategoria.flatMap((id) => {
                const fila = filaPorCategoria.find((h) => String(h.id_equipo) === id);
                const jugadoresDelEquipo = (JUGADORES_POR_EQUIPO.get(id) || [])
                    .filter((j) => !PERFIL_FILTRO_TEMPORADA || String(j.temporada) === String(PERFIL_FILTRO_TEMPORADA));
                return jugadoresDelEquipo.map((j) => ({ ...j, _categoria: fila ? fila.categoria : '' }));
            });

            const plantilla = PERFIL_FILTRO_TEMPORADA ? plantillaCruda : agruparJugadoresPorPersona(plantillaCruda);

            const base = d.pj || 1;
            const pctG = Math.round((d.pg / base) * 100);
            const pctE = Math.round((d.pe / base) * 100);
            const pctP = Math.round((d.pp / base) * 100);

            const filtros = (categoriasDisponibles.length > 1 || temporadasDisponibles.length > 1)
                ? `<div class="grid grid-cols-2 gap-2 mb-4">
        ${categoriasDisponibles.length > 1 ? `
          <select id="sel-perfil-categoria" class="bg-elevado border border-borde rounded-xl px-2 py-2 text-xs text-texto">

            ${categoriasDisponibles.map((c) => `<option value="${c}" ${c === PERFIL_FILTRO_CATEGORIA ? 'selected' : ''}>${escaparHtml(c)}</option>`).join('')}
          </select>
        ` : ''}
        ${temporadasDisponibles.length > 1 ? `
          <select id="sel-perfil-temporada" class="bg-elevado border border-borde rounded-xl px-2 py-2 text-xs text-texto">
            <option value="">Todas las temporadas</option>
            ${temporadasDisponibles.map((t) => `<option value="${t}" ${String(t) === PERFIL_FILTRO_TEMPORADA ? 'selected' : ''}>Temporada ${t}</option>`).join('')}
          </select>
        ` : ''}
      </div>`
                : '';

            const etiquetaCategoria = `${referencia.categoria || ''}${PERFIL_FILTRO_TEMPORADA ? ' · Temporada ' + PERFIL_FILTRO_TEMPORADA : ''}`;

            document.getElementById('modal-contenido').innerHTML = `
    <div class="flex items-center gap-3 mb-4">
      <img src="${referencia.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(referencia.nombre)}');" class="w-14 h-14 rounded-xl object-cover bg-elevado flex-shrink-0"/>
      <div class="min-w-0 flex-1">
        <h2 class="font-display text-xl tracking-wide truncate">${escaparHtml(referencia.nombre)}</h2>
        <span class="text-[11px] text-muted uppercase tracking-wide">${escaparHtml(etiquetaCategoria)}</span>
      </div>
      <button onclick="toggleFavoritoClick()" title="Marcar favorito" class="text-2xl flex-shrink-0 leading-none">${esFavorito(CLUB_PERFIL_ACTUAL) ? '⭐' : '☆'}</button>
    </div>

    ${filtros}

    <div class="grid grid-cols-2 gap-2.5 mb-4">
      <div class="bg-elevado rounded-xl p-3">
        <p class="font-mono text-2xl font-semibold text-accent">${d.promedioGF.toFixed(1)}</p>
        <p class="text-[10px] text-muted uppercase tracking-wide mt-0.5">Goles a favor / partido</p>
      </div>
      <div class="bg-elevado rounded-xl p-3">
        <p class="font-mono text-2xl font-semibold text-live">${d.promedioGC.toFixed(1)}</p>
        <p class="text-[10px] text-muted uppercase tracking-wide mt-0.5">Goles en contra / partido</p>
      </div>
    </div>

    <div class="bg-elevado rounded-xl p-3 mb-5">
      <div class="flex justify-between text-[10px] text-muted uppercase mb-1.5">
        <span>PJ ${d.pj}</span><span>GF ${d.gf}</span><span>GC ${d.gc}</span>
      </div>
      <div class="h-2.5 rounded-full overflow-hidden flex w-full bg-cancha">
        <div style="width:${pctG}%" class="bg-accent"></div>
        <div style="width:${pctE}%" class="bg-warning"></div>
        <div style="width:${pctP}%" class="bg-live"></div>
      </div>
      <div class="flex justify-between text-[10px] mt-1.5">
        <span class="text-accent font-semibold">${d.pg}G</span>
        <span class="text-warning font-semibold">${d.pe}E</span>
        <span class="text-live font-semibold">${d.pp}P</span>
      </div>
    </div>

    ${bloquePalmaresClub(referencia)}

    <h3 class="text-[11px] uppercase tracking-wide text-muted font-semibold mb-2">Plantel</h3>
    ${plantilla.length
                    ? `<div class="space-y-2">${plantilla.map((j) => filaJugador(j, combinando)).join('')}</div>`
                    : `<p class="text-xs text-muted">Plantel — próximamente</p>`}
  `;

            if (categoriasDisponibles.length > 1) {
                document.getElementById('sel-perfil-categoria').addEventListener('change', (e) => {
                    PERFIL_FILTRO_CATEGORIA = e.target.value || null;
                    renderModalPerfilEquipo();
                });
            }
            if (temporadasDisponibles.length > 1) {
                document.getElementById('sel-perfil-temporada').addEventListener('change', (e) => {
                    PERFIL_FILTRO_TEMPORADA = e.target.value || null;
                    renderModalPerfilEquipo();
                });
            }
        }

        function agruparJugadoresPorPersona(lista) {
            const grupos = new Map();

            lista.forEach((j) => {
                const nombreCompleto = [j.Nombre, j.Apellido].filter(Boolean).join(' ').trim().toLowerCase();
                const clave = (j.id_jugador != null && String(j.id_jugador).trim() !== '')
                    ? 'id_' + String(j.id_jugador).trim()
                    : 'nombre_' + nombreCompleto;

                if (!grupos.has(clave)) {
                    grupos.set(clave, { ...j, goles: 0, amarillas: 0, rojas: 0 });
                }
                const g = grupos.get(clave);
                g.goles = (Number(g.goles) || 0) + (Number(j.goles) || 0);
                g.amarillas = (Number(g.amarillas) || 0) + (Number(j.amarillas) || 0);
                g.rojas = (Number(g.rojas) || 0) + (Number(j.rojas) || 0);

                // La foto/nombre que se muestra es la de la fila más reciente
                if (String(j.temporada || '').localeCompare(String(g._temporadaReferencia || ''), undefined, { numeric: true }) >= 0) {
                    g.url_foto = j.url_foto;
                    g.Nombre = j.Nombre;
                    g.Apellido = j.Apellido;
                    g._temporadaReferencia = j.temporada;
                }
            });

            return Array.from(grupos.values());
        }

        function filaJugador(j, mostrarCategoria) {
            const nombreCompleto = [j.Nombre, j.Apellido].filter(Boolean).join(' ') || 'Jugador';
            const goles = Number(j.goles) || 0;
            const amarillas = Number(j.amarillas) || 0;
            const rojas = Number(j.rojas) || 0;

            return `
    <div class="flex items-center gap-2.5 text-xs bg-elevado/40 rounded-xl px-3 py-2">
      <img src="${j.url_foto || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(nombreCompleto)}');" class="w-7 h-7 rounded-full object-cover bg-elevado flex-shrink-0"/>
      <span class="truncate flex-1">${escaparHtml(nombreCompleto)}</span>
      ${mostrarCategoria && j._categoria ? `<span class="text-[9px] text-accent uppercase flex-shrink-0">${escaparHtml(j._categoria)}</span>` : ''}
      <div class="flex items-center gap-2 flex-shrink-0 text-[10px] font-mono">
        ${goles ? `<span class="text-accent font-semibold">⚽${goles}</span>` : ''}
        ${amarillas ? `<span class="text-warning">🟨${amarillas}</span>` : ''}
        ${rojas ? `<span class="text-live">🟥${rojas}</span>` : ''}
      </div>
    </div>
  `;
        }

        async function enviarFeedback() {
            const texto = document.getElementById('feedback-texto').value.trim();
            const estadoEl = document.getElementById('feedback-estado-envio');

            if (!texto) {
                estadoEl.textContent = 'Contanos qué pasó antes de enviar.';
                return;
            }

            estadoEl.textContent = 'Enviando…';
            try {
                const res = await fetch(FORMSPREE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify({
                        mensaje: texto,
                        vista: VISTA_ACTIVA,
                        categoria: CATEGORIA_ACTIVA,
                        jornada: JORNADA_ACTIVA,
                        url: window.location.href,
                        fecha: new Date().toISOString(),
                    }),
                });
                if (!res.ok) throw new Error('No se pudo enviar');

                estadoEl.textContent = '¡Gracias! Ya lo recibimos.';
                document.getElementById('feedback-texto').value = '';
                setTimeout(cerrarModalFeedback, 1500);
            } catch (err) {
                estadoEl.textContent = 'No se pudo enviar, probá de nuevo en un rato.';
            }
        }

        /* ============================================================
         *  ADMIN — PANEL DE CARGA PROTEGIDO POR PIN

         *  título "FUTSAL LIVE" del header.

        (function configurarGestoOcultoAdmin() {
            const titulo = document.getElementById('app-title');
            let temporizador = null;

            const iniciar = () => {
                temporizador = setTimeout(abrirModalAdmin, 2500);
            };
            const cancelar = () => {
                if (temporizador) clearTimeout(temporizador);
            };

            titulo.addEventListener('touchstart', iniciar, { passive: true });
            titulo.addEventListener('touchend', cancelar);
            titulo.addEventListener('touchmove', cancelar);
            titulo.addEventListener('mousedown', iniciar);
            titulo.addEventListener('mouseup', cancelar);
            titulo.addEventListener('mouseleave', cancelar);
        })();

        function renderAdminPin() {
            document.getElementById('admin-contenido').innerHTML = `

    <input id="admin-pin-input" type="password" inputmode="numeric" placeholder="••••" class="w-full mt-1.5 bg-elevado border border-borde rounded-xl p-3 text-center text-lg tracking-widest text-texto"/>

    <p id="admin-pin-estado" class="text-center text-xs text-live mt-2 min-h-[16px]"></p>
  `;
            document.getElementById('admin-pin-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') validarPinAdmin();
            });
        }

        function validarPinAdmin() {
            const pin = document.getElementById('admin-pin-input').value;
            const estadoEl = document.getElementById('admin-pin-estado');
            if (!pin) { estadoEl.textContent = 'Ingresá el PIN.'; return; }

            estadoEl.textContent = 'Verificando…';
            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ accion: 'comprobarPin', pin: pin }),

                .then((res) => res.json())

                        estadoEl.textContent = 'PIN incorrecto.';

            const lista = JSON.parse(cont.dataset.partidos || '[]');
            const p = lista[idx];
            const fila = cont.querySelector(`[data-idx="${idx}"]`);
            const gl = fila.querySelector('.admin-edit-input-local').value;
            const gv = fila.querySelector('.admin-edit-input-visitante').value;
            const fecha = fila.querySelector('.admin-edit-input-fecha').value;
            const estadoEl = fila.querySelector('.admin-edit-estado');

                estadoEl.textContent = 'Completá ambos marcadores.';
                estadoEl.className = 'admin-edit-estado text-center text-[10px] mt-1 text-live';
                return;
            }

            estadoEl.textContent = 'Guardando…';
            estadoEl.className = 'admin-edit-estado text-center text-[10px] mt-1 text-muted';

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    accion: 'editarResultado',
                    pin: ADMIN_PIN_ACTUAL,
                    datos: {
                        categoria: p.categoria,

        const CANTIDAD_DESCENSO_GENERAL = 2;

        function esFaseZonaEstricta(fase) {
            return /zona/i.test(fase); // a diferencia de esFaseZona, NO incluye Copa de Plata
        }

        function calcularTablaMultiFase(categoria, fases, temporadaOverride) {
            const partidosTemporada = temporadaOverride !== undefined
                ? PARTIDOS.filter((p) => String(p.temporada) === String(temporadaOverride))
                : filtrarPorTemporada(PARTIDOS);
            const finalizados = partidosTemporada.filter(
                (p) => p.categoria === categoria &&
                    normalizarEstado(p.estado) === 'finalizado' &&
                    fases.includes(normalizarFase(p.fase))
            );

            const stats = new Map();
            function obtenerStats(id) {
                if (!stats.has(id)) stats.set(id, { pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0 });
                return stats.get(id);
            }

            finalizados.forEach((p) => {
                const local = obtenerStats(String(p.id_local));
                const visita = obtenerStats(String(p.id_visitante));
                const gl = Number(p.goles_local) || 0;
                const gv = Number(p.goles_visitante) || 0;

                local.pj++; visita.pj++;
                local.gf += gl; local.gc += gv;
                visita.gf += gv; visita.gc += gl;

                if (gl > gv) { local.pg++; visita.pp++; }
                else if (gl < gv) { visita.pg++; local.pp++; }
                else { local.pe++; visita.pe++; }
            });

            const filas = Array.from(stats.entries()).map(([id, s]) => {
                const dif = s.gf - s.gc;
                const pts = s.pg * 3 + s.pe;
                return { equipo: equipoInfo(id), id, ...s, dif, pts };
            });

            filas.sort((a, b) => b.pts - a.pts || b.dif - a.dif || b.gf - a.gf);
            return filas;
        }

        function obtenerParticipantesPlayoff(categoria) {
            const partidos = filtrarPorTemporada(PARTIDOS).filter(
                (p) => p.categoria === categoria && /playoff|play\s*off/i.test(normalizarFase(p.fase))
            );
            if (!partidos.length) return [];

            const porRonda = new Map();
            partidos.forEach((p) => {
                const { ronda } = analizarRondaBracket(p.etiqueta_fecha || p.fecha_nro);
                if (!porRonda.has(ronda)) porRonda.set(ronda, new Set());
                porRonda.get(ronda).add(String(p.id_local));
                porRonda.get(ronda).add(String(p.id_visitante));
            });

            // La ronda con más equipos distintos es la primera (la de más participantes).
            let mejorRonda = null, mejorSize = 0;
            porRonda.forEach((set, ronda) => {
                if (set.size > mejorSize) { mejorSize = set.size; mejorRonda = ronda; }
            });
            return mejorRonda ? Array.from(porRonda.get(mejorRonda)) : [];
        }

  `;
        }

            actualizarProgresoSponsorUI();
            if (SPONSOR_PROGRESO_INTERVALO) clearInterval(SPONSOR_PROGRESO_INTERVALO);
            SPONSOR_PROGRESO_INTERVALO = setInterval(() => {
                const restante = 92 - SPONSOR_PROGRESO_PORCENTAJE;
                SPONSOR_PROGRESO_PORCENTAJE += Math.max(0.5, restante * 0.08);
                if (SPONSOR_PROGRESO_PORCENTAJE >= 92) SPONSOR_PROGRESO_PORCENTAJE = 92;

            const pct = Math.round(SPONSOR_PROGRESO_PORCENTAJE);
            document.getElementById('sponsor-grande-progreso-fill').style.width = pct + '%';
            document.getElementById('sponsor-grande-progreso-texto').textContent = `Cargando datos… ${pct}%`;
        }

        function completarProgresoSponsor() {
            if (SPONSOR_PROGRESO_INTERVALO) { clearInterval(SPONSOR_PROGRESO_INTERVALO); SPONSOR_PROGRESO_INTERVALO = null; }
            SPONSOR_PROGRESO_PORCENTAJE = 100;
            actualizarProgresoSponsorUI();
            setTimeout(() => {
                document.getElementById('sponsor-grande-progreso').classList.add('hidden');
                document.getElementById('sponsor-grande-cerrar').classList.remove('hidden');
                SPONSOR_MODAL_BLOQUEADO = false;
            }, 100);
        }

        function cerrarSponsorGrande() {
            document.getElementById('modal-sponsor-grande').classList.add('hidden');
        }

        function registrarNavegacionParaSponsor() {
            if (!SPONSORS.length) return;
            CONTADOR_NAVEGACIONES++;
            if (CONTADOR_NAVEGACIONES >= 10) {
                CONTADOR_NAVEGACIONES = 0;
                GRANDE_SPONSOR_INDICE = (GRANDE_SPONSOR_INDICE + 1) % SPONSORS.length;
                mostrarSponsorGrande(false);
            }
        }

        function mostrarSkeleton() {
            const skeleton = document.getElementById('skeleton');
            document.getElementById('vista-contenido').classList.add('hidden');
            document.getElementById('estado-error').classList.add('hidden');
            skeleton.classList.remove('hidden');
            skeleton.innerHTML = Array.from({ length: 5 })
                .map(
                    () => `
      <div class="bg-surface border border-borde rounded-2xl px-4 py-3.5 space-y-3">
        <div class="skeleton h-3 w-24 rounded"></div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="skeleton w-7 h-7 rounded-full"></div>
            <div class="skeleton h-3 w-28 rounded"></div>
          </div>
          <div class="skeleton h-4 w-4 rounded"></div>
        </div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="skeleton w-7 h-7 rounded-full"></div>
            <div class="skeleton h-3 w-20 rounded"></div>
          </div>
          <div class="skeleton h-4 w-4 rounded"></div>
        </div>
      </div>`
                )
                .join('');
        }

        let IMAGENES_CARGADAS = new Set();

        document.addEventListener('load', (e) => {
            if (e.target.tagName === 'IMG') {
                e.target.classList.add('img-cargada');
                if (e.target.src) IMAGENES_CARGADAS.add(e.target.src);
            }
        }, true);

        function marcarImagenSiCacheada(img) {
            if (img.complete || IMAGENES_CARGADAS.has(img.src)) {
                img.classList.add('img-cargada');
            }
        }

        const observadorImagenes = new MutationObserver((mutaciones) => {
            mutaciones.forEach((m) => {
                m.addedNodes.forEach((nodo) => {
                    if (nodo.nodeType !== 1) return;
                    if (nodo.tagName === 'IMG') marcarImagenSiCacheada(nodo);
                    if (nodo.querySelectorAll) nodo.querySelectorAll('img').forEach(marcarImagenSiCacheada);
                });
            });
        });

        const contVista = document.getElementById('vista-contenido');
        const contModal = document.getElementById('modal-contenido');
        if (contVista) observadorImagenes.observe(contVista, { childList: true, subtree: true });
        if (contModal) observadorImagenes.observe(contModal, { childList: true, subtree: true });

        precargarSponsorTemprano();

        cargarFavoritos();
        cargarDatos();
    </script>

    <!-- MODAL DE CONFIRMACIÓN AL DESFAVORITEAR -->
    <div id="modal-confirmar-desfav" class="hidden fixed inset-0 z-[999999] fixed items-center justify-center px-6">
        <div class="absolute inset-0 bg-black/80"></div>
        <div class="relative bg-surface border border-borde rounded-3xl p-6 max-w-xs w-full text-center">
            <p id="confirmar-desfav-texto" class="text-sm text-texto mb-5"></p>
            <div class="flex gap-2">
                <button onclick="cerrarConfirmarDesfav()"
                    class="flex-1 bg-elevado text-texto font-semibold text-sm rounded-xl py-2.5">Cancelar</button>
                <button onclick="confirmarDesfavorito()"
                    class="flex-1 bg-live text-white font-semibold text-sm rounded-xl py-2.5">Sacar</button>
            </div>
        </div>
    </div>
</body>

</html>
