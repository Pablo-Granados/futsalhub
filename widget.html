<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futsal Hub — Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/output.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --wf-bg-surface: #121821;
            --wf-bg-elevado: #1A2230;
            --wf-borde: rgba(255, 255, 255, 0.08);
            --wf-texto: #F2F5F8;
            --wf-muted: #8894A3;
        }

        body.tema-claro {
            --wf-bg-surface: #FFFFFF;
            --wf-bg-elevado: #F1F3F5;
            --wf-borde: rgba(0, 0, 0, 0.10);
            --wf-texto: #14181F;
            --wf-muted: #5A6472;
        }

        body {
            background: transparent;
            color: var(--wf-texto);
        }

        body.wf-standalone {
            background: #0B0F14;
        }

        body.wf-standalone.tema-claro {
            background: #FFFFFF;
        }

        .wf-surface {
            background: var(--wf-bg-surface);
            border-color: var(--wf-borde);
        }

        .wf-elevado {
            background: var(--wf-bg-elevado);
        }

        .wf-borde {
            border-color: var(--wf-borde);
        }

        .wf-muted {
            color: var(--wf-muted);
        }

        .exportando-captura,
        .exportando-captura * {
            line-height: 2 !important;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        * {
            scrollbar-width: none;
        }
    </style>
</head>

<body class="font-body text-texto">
    <div id="widget-contenido" class="p-3">
        <div id="skeleton" class="space-y-3 text-center py-8">
            <svg class="animate-spin mx-auto" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="var(--wf-muted)" stroke-width="3" stroke-linecap="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
            <p class="text-xs wf-muted mt-2">Cargando partidos…</p>
        </div>
        <div id="vista-widget" class="hidden"></div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNynwx8VfnEkSYHQZAeuz2r0CuhenLMtRdnt0iAixk5ic26rPhy1L3m5Sxm4m0GHXv/exec';
        const params = new URLSearchParams(window.location.search);
        const VISTA = params.get('vista') || 'perfil';

        let EQUIPOS = [], EQUIPOS_POR_ID = new Map(), PARTIDOS = [];
        const ORDEN_CATEGORIAS = ['Primera A', 'Reserva A', 'Femenino A', 'Primera B', 'Reserva B'];
        const CATEGORIAS_CON_DESCENSO = ['Primera A', 'Femenino A'];
        const CANTIDAD_DESCENSO_GENERAL = 2;
        let AJUSTES_PUNTOS_WIDGET = [];

        function equipoInfo(id) {
            return EQUIPOS_POR_ID.get(String(id)) || { nombre: 'Equipo desconocido', url_escudo: '' };
        }
        function escaparHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        async function esperarImagenesCargadas(el) {
            const imgs = Array.from(el.querySelectorAll('img'));
            await Promise.all(imgs.map((img) => {
                if (img.complete) return Promise.resolve();
                return new Promise((resolve) => {
                    img.addEventListener('load', resolve, { once: true });
                    img.addEventListener('error', resolve, { once: true });
                });
            }));
        }

        async function compartirPerfilWidget(idEquipo, nombreEquipo) {
            const el = document.getElementById('vista-widget');
            const boton = document.getElementById('btn-compartir-widget');
            const textoOriginal = boton ? boton.innerHTML : '';
            if (boton) { boton.innerHTML = '…'; boton.disabled = true; }

            const texto = `📋 Últimos 5 partidos de ${nombreEquipo}\n\nMirá todo en Futsal Hub 👉 https://futsalrosario.vercel.app`;

            try {
                if (typeof html2canvas !== 'function') throw new Error('sin_html2canvas');

                await esperarImagenesCargadas(el);
                if (document.fonts && document.fonts.ready) await document.fonts.ready;

                const paddingOriginal = el.style.padding;
                el.style.padding = '16px';
                el.classList.add('exportando-captura');
                let canvas;
                try {
                    canvas = await html2canvas(el, { backgroundColor: '#0B0F14', scale: 2, useCORS: true });
                } finally {
                    el.style.padding = paddingOriginal;
                    el.classList.remove('exportando-captura');
                }

                const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
                const archivo = new File([blob], `futsalhub_${nombreEquipo.replace(/\s+/g, '_')}.png`, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
                    await navigator.share({ files: [archivo], text: texto, title: 'Futsal Hub' });
                    return;
                }
                throw new Error('sin_share_archivos');
            } catch (e) {
                // Respaldo: comparte solo el texto por WhatsApp Web, sin imagen.
                window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
            } finally {
                if (boton) { boton.innerHTML = textoOriginal; boton.disabled = false; }
            }
        }

        function escudoPorDefecto(nombre) {
            const iniciales = nombre.split(' ').slice(0, 2).map((p) => p[0]).join('').toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="100%" height="100%" rx="20" fill="#1A2230"/><text x="50%" y="55%" text-anchor="middle" fill="#35D07F" font-family="Inter" font-size="14" font-weight="600" dy=".1em">${iniciales}</text></svg>`;
            return 'data:image/svg+xml;base64,' + btoa(svg);
        }
        function normalizarClub(nombre) {
            return String(nombre || '').trim().toLowerCase();
        }
        function claveClub(equipo) {
            return equipo.id_club ? ('club_' + String(equipo.id_club).trim().toLowerCase()) : normalizarClub(equipo.nombre);
        }
        function obtenerClubsUnicos() {
            const vistos = new Set();
            const resultado = [];
            EQUIPOS.forEach((e) => {
                const clave = claveClub(e);
                if (!vistos.has(clave)) { vistos.add(clave); resultado.push(e); }
            });
            return resultado;
        }
        function equiposDelClub(equipoReferencia) {
            const clave = claveClub(equipoReferencia);
            return EQUIPOS.filter((e) => claveClub(e) === clave);
        }
        function normalizarEstado(estadoRaw) {
            const e = String(estadoRaw || '').toLowerCase();
            if (e.includes('final')) return 'finalizado';
            return 'programado';
        }
        function normalizarFase(faseRaw) {
            const f = String(faseRaw || '').trim();
            return f === '' ? 'Regular' : f;
        }

        function detectarTema() {
            if (window.self === window.top) {
                // No está dentro de un iframe (lo estás probando solo) — le damos
                // un fondo de respaldo, porque en producción ese fondo lo aporta
                // la página que lo embeba.
                document.body.classList.add('wf-standalone');
            }
            const params2 = new URLSearchParams(window.location.search);
            const forzado = params2.get('tema'); // ?tema=claro o ?tema=oscuro, opcional
            if (forzado === 'claro') { document.body.classList.add('tema-claro'); return; }
            if (forzado === 'oscuro') { return; }
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.body.classList.add('tema-claro');
            }
        }

        function calcularForma(idEquipo) {
            const idStr = String(idEquipo);
            return PARTIDOS
                .filter((p) => (String(p.id_local) === idStr || String(p.id_visitante) === idStr) && normalizarEstado(p.estado) === 'finalizado')
                .sort((a, b) => {
                    const porTemporada = String(b.temporada || '').localeCompare(String(a.temporada || ''), undefined, { numeric: true });
                    if (porTemporada !== 0) return porTemporada;
                    return Number(b.fecha_nro) - Number(a.fecha_nro);
                })
                .slice(0, 5)
                .map((p) => {
                    const esLocal = String(p.id_local) === idStr;
                    const propios = esLocal ? Number(p.goles_local) || 0 : Number(p.goles_visitante) || 0;
                    const rivalGoles = esLocal ? Number(p.goles_visitante) || 0 : Number(p.goles_local) || 0;
                    const rival = equipoInfo(esLocal ? p.id_visitante : p.id_local);
                    let resultado = 'E';
                    if (propios > rivalGoles) resultado = 'G';
                    else if (propios < rivalGoles) resultado = 'P';
                    return { resultado, rival, propios, rivalGoles, esLocal };
                });
        }

        function ordenarCategorias(categorias) {
            return [...categorias].sort((a, b) => {
                const ia = ORDEN_CATEGORIAS.indexOf(a);
                const ib = ORDEN_CATEGORIAS.indexOf(b);
                if (ia === -1 && ib === -1) return a.localeCompare(b);
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });
        }

        function obtenerTemporadasWidget(categoria) {
            const valores = new Set();
            PARTIDOS.forEach((p) => {
                if (p.categoria !== categoria) return;
                if (p.temporada != null && p.temporada !== '') valores.add(String(p.temporada));
            });
            return Array.from(valores).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
        }

        function temporadaEnCursoWidget(categoria, temporada) {
            return PARTIDOS.some((p) =>
                p.categoria === categoria && String(p.temporada) === String(temporada) &&
                normalizarFase(p.fase) === 'Regular' && normalizarEstado(p.estado) !== 'finalizado'
            );
        }

        function calcularTablaWidget(categoria, temporada) {
            const finalizados = PARTIDOS.filter(
                (p) => p.categoria === categoria && String(p.temporada) === String(temporada) &&
                    normalizarEstado(p.estado) === 'finalizado' && normalizarFase(p.fase) === 'Regular'
            );
            const stats = new Map();
            function obtenerStats(id) {
                if (!stats.has(id)) stats.set(id, { pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0 });
                return stats.get(id);
            }
            finalizados.forEach((p) => {
                const gl = Number(p.goles_local) || 0;
                const gv = Number(p.goles_visitante) || 0;
                const local = obtenerStats(String(p.id_local));
                const visita = obtenerStats(String(p.id_visitante));
                local.pj++; local.gf += gl; local.gc += gv;
                visita.pj++; visita.gf += gv; visita.gc += gl;
                if (gl > gv) { local.pg++; visita.pp++; }
                else if (gl < gv) { visita.pg++; local.pp++; }
                else { local.pe++; visita.pe++; }
            });
            const filas = Array.from(stats.entries()).map(([id, s]) => {
                const dif = s.gf - s.gc;
                const pts = s.pg * 3 + s.pe;
                return { equipo: equipoInfo(id), id, ...s, dif, pts };
            });
            const ajustes = AJUSTES_PUNTOS_WIDGET.filter((a) => a.categoria === categoria && String(a.temporada) === String(temporada));
            ajustes.forEach((a) => {
                const fila = filas.find((f) => String(f.id) === String(a.id_equipo));
                if (fila) fila.pts += Number(a.puntos) || 0;
            });
            filas.sort((a, b) => b.pts - a.pts || b.dif - a.dif || b.gf - a.gf);
            return { filas, ajustes };
        }

        function filaTablaWidget(f, posicion, umbralDescenso) {
            const colorDif = f.dif > 0 ? 'text-accent' : f.dif < 0 ? 'text-live' : '';
            const esDescenso = umbralDescenso != null && posicion > umbralDescenso;
            return `
    <tr class="border-b wf-borde last:border-0" style="${esDescenso ? 'background: rgba(255,75,85,0.06);' : ''}">
      <td class="py-2 pl-1 font-mono text-[10px] ${esDescenso ? 'text-live font-semibold' : 'wf-muted'}">${posicion}</td>
      <td class="py-2 pr-1">
        <div class="flex items-center gap-1 min-w-0">
          <img src="${f.equipo.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(f.equipo.nombre)}');" class="w-4 h-4 rounded-full object-cover wf-elevado flex-shrink-0"/>
          <span class="text-[10px] leading-tight truncate ${esDescenso ? 'text-live' : ''}" style="${esDescenso ? '' : 'color: var(--wf-texto);'}">${escaparHtml(f.equipo.nombre)}</span>
        </div>
      </td>
      <td class="py-2 text-center font-mono text-[10px] wf-muted">${f.pj}</td>
      <td class="py-2 text-center font-mono text-[10px] wf-muted">${f.pg}</td>
      <td class="py-2 text-center font-mono text-[10px] wf-muted">${f.pe}</td>
      <td class="py-2 text-center font-mono text-[10px] wf-muted">${f.pp}</td>
      <td class="py-2 text-center font-mono text-[10px] wf-muted">${f.gf}</td>
      <td class="py-2 text-center font-mono text-[10px] wf-muted">${f.gc}</td>
      <td class="py-2 text-center font-mono text-[10px] ${colorDif}" style="${colorDif ? '' : 'color: var(--wf-muted);'}">${f.dif > 0 ? '+' : ''}${f.dif}</td>
      <td class="py-2 pr-1 text-right font-mono text-[11px] font-semibold" style="color: var(--wf-texto);">${f.pts}</td>
    </tr>
  `;
        }

        function iconoPalmares(tipo) {
            if (tipo === 'campeon') return '🏆';
            if (tipo === 'subcampeon') return '🥈';
            if (tipo === 'copaplata') return '🥉';
            if (tipo === 'verano') return '☀️';
            if (tipo === 'ascenso') return '⬆️';
            if (tipo === 'descenso') return '⬇️';
            return '';
        }

        function calcularRachaEquipo(idEquipo) {
            const idStr = String(idEquipo);
            const resultados = PARTIDOS
                .filter((p) => (String(p.id_local) === idStr || String(p.id_visitante) === idStr) && normalizarEstado(p.estado) === 'finalizado')
                .sort((a, b) => {
                    const porTemporada = String(b.temporada || '').localeCompare(String(a.temporada || ''), undefined, { numeric: true });
                    if (porTemporada !== 0) return porTemporada;
                    return Number(b.fecha_nro) - Number(a.fecha_nro);
                })
                .map((p) => {
                    const esLocal = String(p.id_local) === idStr;
                    const propios = esLocal ? Number(p.goles_local) || 0 : Number(p.goles_visitante) || 0;
                    const rival = esLocal ? Number(p.goles_visitante) || 0 : Number(p.goles_local) || 0;
                    if (propios > rival) return 'G';
                    if (propios < rival) return 'P';
                    return 'E';
                });
            if (!resultados.length) return null;
            function contarMientras(cond) {
                let n = 0;
                for (const r of resultados) { if (cond(r)) n++; else break; }
                return n;
            }
            return {
                winStreak: contarMientras((r) => r === 'G'),
                lossStreak: contarMientras((r) => r === 'P'),
                unbeatenStreak: contarMientras((r) => r !== 'P'),
                winlessStreak: contarMientras((r) => r !== 'G'),
            };
        }

        function bloqueRachaWidget(idEquipo) {
            const r = calcularRachaEquipo(idEquipo);
            if (!r) return '';
            let texto = null, icono = null;
            const RACHA_MINIMO = 3;
            if (r.winStreak >= RACHA_MINIMO) { icono = '🔥'; texto = `Ganó ${r.winStreak} seguidos`; }
            else if (r.lossStreak >= RACHA_MINIMO) { icono = '❄️'; texto = `Perdió ${r.lossStreak} seguidos`; }
            else if (r.unbeatenStreak >= RACHA_MINIMO) { icono = '🛡️'; texto = `No pierde hace ${r.unbeatenStreak} partidos`; }
            else if (r.winlessStreak >= RACHA_MINIMO) { icono = '😶'; texto = `No gana hace ${r.winlessStreak} partidos`; }
            if (!texto) return '';
            return `<p class="text-xs wf-elevado rounded-xl px-3 py-2 mb-3 flex items-center gap-2" style="color: var(--wf-texto);"><span>${icono}</span>${escaparHtml(texto)}</p>`;
        }

        function renderBuscadorPerfil() {
            const cont = document.getElementById('vista-widget');
            const clubs = obtenerClubsUnicos();
            cont.innerHTML = `
        <input id="buscador-widget" type="text" placeholder="Buscá tu equipo…" class="w-full wf-elevado border wf-borde rounded-xl px-3 py-2.5 text-sm placeholder:wf-muted mb-3" style="color: var(--wf-texto);"/>
        <div id="resultados-widget" class="space-y-2"></div>
        <p class="text-center text-[9px] wf-muted mt-4">Más estadísticas en <a href="https://futsalrosario.vercel.app" target="_blank" class="text-accent">Futsal Hub</a></p>
      `;
            const input = document.getElementById('buscador-widget');
            const pintarResultados = (filtro) => {
                const filtrados = filtro ? clubs.filter((c) => normalizarClub(c.nombre).includes(normalizarClub(filtro))) : [];
                document.getElementById('resultados-widget').innerHTML = filtrados.slice(0, 6).map((c) => `
          <button data-equipo-id="${c.id_equipo}" class="w-full flex items-center gap-3 wf-surface border wf-borde rounded-xl p-3 text-left">
            <img src="${c.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(c.nombre)}');" class="w-10 h-10 rounded-lg object-cover wf-elevado flex-shrink-0"/>
            <span class="font-display text-sm tracking-wide" style="color: var(--wf-texto);">${escaparHtml(c.nombre)}</span>
          </button>
        `).join('');
            };
            input.addEventListener('input', (e) => pintarResultados(e.target.value));
            document.getElementById('resultados-widget').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-equipo-id]');
                if (btn) renderPerfilEquipo(btn.dataset.equipoId);
            });
        }

        let CATEGORIA_TABLA_WIDGET = null;

        function renderTablaWidget() {
            const categorias = ordenarCategorias([...new Set(PARTIDOS.map((p) => p.categoria).filter(Boolean))]);
            if (!CATEGORIA_TABLA_WIDGET || !categorias.includes(CATEGORIA_TABLA_WIDGET)) {
                CATEGORIA_TABLA_WIDGET = categorias[0] || null;
            }
            const cont = document.getElementById('vista-widget');
            if (!CATEGORIA_TABLA_WIDGET) {
                cont.innerHTML = `<p class="text-center wf-muted text-sm">No hay categorías cargadas.</p>`;
                return;
            }
            const temporadas = obtenerTemporadasWidget(CATEGORIA_TABLA_WIDGET);
            const temporada = temporadas[0];
            const { filas, ajustes } = calcularTablaWidget(CATEGORIA_TABLA_WIDGET, temporada);
            const tieneDescenso = CATEGORIAS_CON_DESCENSO.includes(CATEGORIA_TABLA_WIDGET);
            const umbral = tieneDescenso && filas.length ? filas.length - Math.min(CANTIDAD_DESCENSO_GENERAL, filas.length) : null;
            const enCurso = tieneDescenso && temporadaEnCursoWidget(CATEGORIA_TABLA_WIDGET, temporada);

            cont.innerHTML = `
      <div class="flex items-center justify-between gap-2 mb-3">
        <select id="sel-categoria-widget" class="flex-1 wf-elevado border wf-borde rounded-xl px-3 py-2 text-sm" style="color: var(--wf-texto);">
          ${categorias.map((c) => `<option value="${escaparHtml(c)}" ${c === CATEGORIA_TABLA_WIDGET ? 'selected' : ''}>${escaparHtml(c)}</option>`).join('')}
        </select>
        <button id="btn-compartir-tabla-widget" onclick="compartirTablaWidget()" class="wf-muted flex-shrink-0" title="Compartir">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m0 1.67c2.24 0 4.35.87 5.94 2.46a8.24 8.24 0 0 1 2.43 5.88c0 4.59-3.74 8.33-8.33 8.33a8.3 8.3 0 0 1-4.24-1.16l-.3-.18-3.12.82.83-3.04-.2-.31a8.26 8.26 0 0 1-1.27-4.42c0-4.59 3.74-8.33 8.33-8.33Zm-3.13 4.02c-.16 0-.42.06-.64.31-.22.25-.85.83-.85 2.03 0 1.2.87 2.35.99 2.51.12.16 1.71 2.71 4.21 3.71.59.24 1.05.38 1.41.48.59.17 1.13.14 1.55.09.47-.07 1.46-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.07-.11-.24-.17-.5-.3-.26-.13-1.53-.75-1.77-.84-.24-.09-.41-.13-.58.13-.17.26-.66.84-.81 1.01-.15.17-.3.19-.55.06-.26-.13-1.09-.4-2.08-1.28-.77-.68-1.29-1.53-1.44-1.79-.15-.26-.02-.4.11-.53.12-.12.26-.3.39-.45.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45-.06-.13-.58-1.4-.8-1.92-.21-.5-.42-.43-.58-.44h-.5Z"/></svg>
        </button>
      </div>
      <div id="tabla-widget-captura">
        <h2 class="font-display text-base tracking-wide mb-2" style="color: var(--wf-texto);">${escaparHtml(CATEGORIA_TABLA_WIDGET)} — Temporada ${escaparHtml(String(temporada || ''))}</h2>
        ${filas.length ? `
          <div class="wf-surface border wf-borde rounded-2xl overflow-hidden">
            <table class="w-full text-left table-fixed">
              <colgroup><col style="width:5%"><col style="width:26%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:8%"><col style="width:8%"><col style="width:10%"><col style="width:15%"></colgroup>
              <thead>
                <tr class="text-[9px] uppercase wf-muted border-b wf-borde">
                  <th class="py-2 pl-1 font-medium">#</th><th class="py-2 font-medium">Equipo</th><th class="py-2 text-center font-medium">PJ</th><th class="py-2 text-center font-medium">PG</th><th class="py-2 text-center font-medium">PE</th><th class="py-2 text-center font-medium">PP</th><th class="py-2 text-center font-medium">GF</th><th class="py-2 text-center font-medium">GC</th><th class="py-2 text-center font-medium">DIF</th><th class="py-2 pr-1 text-right font-medium">Pts</th>
                </tr>
              </thead>
              <tbody>${filas.map((f, i) => filaTablaWidget(f, i + 1, umbral)).join('')}</tbody>
            </table>
          </div>
          ${umbral != null ? `<p class="text-[10px] text-live px-1 mt-1.5">Últimas ${filas.length - umbral} posiciones: ${enCurso ? 'en puestos de descenso' : 'descenso'}.</p>` : ''}
          ${ajustes.map((a) => {
                const eq = equipoInfo(a.id_equipo);
                const signo = Number(a.puntos) >= 0 ? '+' : '';
                return `<p class="text-[10px] px-1 mt-1" style="color: #FFC93C;">${escaparHtml(eq.nombre)}: ${signo}${a.puntos} pts${a.motivo ? ' — ' + escaparHtml(a.motivo) : ''}</p>`;
            }).join('')}
        ` : `<p class="text-center wf-muted text-sm py-8">Todavía no hay partidos finalizados.</p>`}
      </div>
      <p class="text-center text-[9px] wf-muted mt-4">Más estadísticas en <a href="https://futsalrosario.vercel.app" target="_blank" class="text-accent">Futsal Hub</a></p>
    `;

            document.getElementById('sel-categoria-widget').addEventListener('change', (e) => {
                CATEGORIA_TABLA_WIDGET = e.target.value;
                renderTablaWidget();
            });
        }

        async function compartirTablaWidget() {
            const el = document.getElementById('tabla-widget-captura');
            const boton = document.getElementById('btn-compartir-tabla-widget');
            const original = boton ? boton.innerHTML : '';
            if (boton) { boton.innerHTML = '…'; boton.disabled = true; }

            const texto = `📋 Tabla de posiciones — ${CATEGORIA_TABLA_WIDGET}\n\nMirá todo en Futsal Hub 👉 https://futsalrosario.vercel.app`;

            try {
                if (typeof html2canvas !== 'function') throw new Error('sin_html2canvas');
                await esperarImagenesCargadas(el);
                if (document.fonts && document.fonts.ready) await document.fonts.ready;

                const paddingOriginal = el.style.padding;
                el.style.padding = '16px';
                el.classList.add('exportando-captura');
                let canvas;
                try {
                    canvas = await html2canvas(el, { backgroundColor: '#0B0F14', scale: 2, useCORS: true });
                } finally {
                    el.style.padding = paddingOriginal;
                    el.classList.remove('exportando-captura');
                }

                const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
                const archivo = new File([blob], `futsalhub_tabla_${CATEGORIA_TABLA_WIDGET.replace(/\s+/g, '_')}.png`, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
                    await navigator.share({ files: [archivo], text: texto, title: 'Futsal Hub' });
                    return;
                }
                throw new Error('sin_share_archivos');
            } catch (e) {
                window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
            } finally {
                if (boton) { boton.innerHTML = original; boton.disabled = false; }
            }
        }

        function renderPerfilEquipo(idEquipo) {
            const equipo = equipoInfo(idEquipo);
            const forma = calcularForma(idEquipo);
            const cont = document.getElementById('vista-widget');
            cont.innerHTML = `
                <div class="flex items-center justify-between mb-3">
          <button id="btn-volver-widget" class="text-[11px] text-accent font-semibold uppercase">← Buscar otro equipo</button>
          <button id="btn-compartir-widget" onclick='compartirPerfilWidget(${JSON.stringify(idEquipo)}, ${JSON.stringify(equipo.nombre)})' class="text-muted" title="Compartir">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m0 1.67c2.24 0 4.35.87 5.94 2.46a8.24 8.24 0 0 1 2.43 5.88c0 4.59-3.74 8.33-8.33 8.33a8.3 8.3 0 0 1-4.24-1.16l-.3-.18-3.12.82.83-3.04-.2-.31a8.26 8.26 0 0 1-1.27-4.42c0-4.59 3.74-8.33 8.33-8.33Zm-3.13 4.02c-.16 0-.42.06-.64.31-.22.25-.85.83-.85 2.03 0 1.2.87 2.35.99 2.51.12.16 1.71 2.71 4.21 3.71.59.24 1.05.38 1.41.48.59.17 1.13.14 1.55.09.47-.07 1.46-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.07-.11-.24-.17-.5-.3-.26-.13-1.53-.75-1.77-.84-.24-.09-.41-.13-.58.13-.17.26-.66.84-.81 1.01-.15.17-.3.19-.55.06-.26-.13-1.09-.4-2.08-1.28-.77-.68-1.29-1.53-1.44-1.79-.15-.26-.02-.4.11-.53.12-.12.26-.3.39-.45.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45-.06-.13-.58-1.4-.8-1.92-.21-.5-.42-.43-.58-.44h-.5Z"/></svg>
          </button>
        </div>
        <div class="flex items-center gap-3 mb-4">
          <img src="${equipo.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(equipo.nombre)}');" class="w-12 h-12 rounded-xl object-cover wf-elevado flex-shrink-0"/>
          <div class="min-w-0">
            <h2 class="font-display text-lg tracking-wide truncate" style="color: var(--wf-texto);">${escaparHtml(equipo.nombre)}</h2>
            <span class="text-[10px] uppercase wf-muted">${escaparHtml(equipo.categoria || '')}</span>
          </div>
        </div>
        ${bloqueRachaWidget(idEquipo)}
        <h3 class="text-[11px] uppercase tracking-wide wf-muted font-semibold mb-2">Forma · últimos 5</h3>
                ${forma.length ? `<div class="space-y-2">${forma.map((f) => `
          <div class="flex items-center justify-between text-xs">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-5 h-5 flex items-center justify-center rounded wf-elevado text-[10px] font-bold wf-muted flex-shrink-0">${f.esLocal ? 'L' : 'V'}</span>
              <img src="${f.rival.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(f.rival.nombre)}');" class="w-5 h-5 rounded-full object-cover wf-elevado flex-shrink-0"/>
              <span class="truncate" style="color: var(--wf-texto);">${escaparHtml(f.rival.nombre)}</span>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="font-mono font-semibold" style="color: var(--wf-texto);">${f.propios}-${f.rivalGoles}</span>
              <span class="w-5 h-5 flex items-center justify-center rounded-full font-bold text-[10px] ${f.resultado === 'G' ? 'bg-accent text-cancha' : f.resultado === 'E' ? 'bg-warning text-cancha' : 'bg-live text-white'}">${f.resultado}</span>
            </div>
          </div>
        `).join('')}</div>` : `<p class="text-xs wf-muted">Todavía no hay partidos finalizados.</p>`}
        <p class="text-center text-[9px] wf-muted mt-4">Ver más en <a href="https://futsalrosario.vercel.app" target="_blank" class="text-accent">Futsal Hub</a></p>
      `;
            document.getElementById('btn-volver-widget').addEventListener('click', renderBuscadorPerfil);
        }

        async function cargarDatosWidget() {
            try {
                const res = await fetch(APPS_SCRIPT_URL + '?api=1&_=' + Date.now(), { cache: 'no-store' });
                const json = await res.json();
                if (!json.ok) throw new Error(json.error);
                EQUIPOS = json.data.equipos;
                EQUIPOS_POR_ID = new Map(EQUIPOS.map((eq) => [String(eq.id_equipo), eq]));
                PARTIDOS = json.data.partidos;
                AJUSTES_PUNTOS_WIDGET = json.data.ajustesPuntos || [];

                document.getElementById('skeleton').classList.add('hidden');
                document.getElementById('vista-widget').classList.remove('hidden');

                if (VISTA === 'perfil') renderBuscadorPerfil();
                else if (VISTA === 'tabla') renderTablaWidget();
            } catch (err) {
                document.getElementById('skeleton').classList.add('hidden');
                document.getElementById('vista-widget').classList.remove('hidden');
                document.getElementById('vista-widget').innerHTML = `<p class="text-center text-live text-sm">No se pudo cargar. Probá de nuevo más tarde.</p>`;
            }
        }

        detectarTema();
        cargarDatosWidget();
    </script>
</body>

</html>
