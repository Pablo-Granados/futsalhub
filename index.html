<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F14" />
    <title>ARF Futsal | Fixture en vivo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/output.css">
    <style>
        .lineas-cancha {
            background-image: repeating-linear-gradient(135deg,
                    rgba(53, 208, 127, 0.10) 0px,
                    rgba(53, 208, 127, 0.10) 2px,
                    transparent 2px,
                    transparent 14px);
        }

        .punteada-central {
            background-image: repeating-linear-gradient(to right,
                    rgba(255, 255, 255, 0.14) 0, rgba(255, 255, 255, 0.14) 6px,
                    transparent 6px, transparent 12px);
        }

        @keyframes pulso-vivo {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.85);
            }
        }

        .punto-vivo {
            animation: pulso-vivo 1.3s ease-in-out infinite;
        }

        @keyframes brillo-skeleton {
            0% {
                background-position: -200px 0;
            }

            100% {
                background-position: 200px 0;
            }
        }

        @keyframes destacadosIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .destacados-in {
            animation: destacadosIn 0.25s ease-out;
        }

        .skeleton {
            background: linear-gradient(90deg, #171f2a 25%, #202b3a 37%, #171f2a 63%);
            background-size: 400px 100%;
            animation: brillo-skeleton 1.4s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        * {
            scrollbar-width: none;
        }

        #vista-contenido img,
        #toast-sponsor img,
        #banner-sponsor-fijo img {
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        #vista-contenido img.img-cargada,
        #toast-sponsor img.img-cargada,
        #banner-sponsor-fijo img.img-cargada {
            opacity: 1;
        }
    </style>
    <script defer src="https://cloud.umami.is/script.js"
        data-website-id="6e64ba6f-14db-4908-9251-0f9e83fbf2ce"></script>
</head>

<body class="bg-[#05070a] font-body text-texto">

    <div class="max-w-md mx-auto min-h-screen bg-cancha shadow-2xl shadow-black/50 relative">

        <!-- HEADER -->
        <header class="sticky top-0 z-20 bg-cancha/95 backdrop-blur border-b border-borde lineas-cancha">
            <div class="flex items-center justify-between px-4 pt-4">

                    <p class="text-[11px] uppercase tracking-[0.2em] text-muted font-medium">Desarrollado por Pablo
                        Granados</p>

                </div>

                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <script>
        /* ============================================================
     *  CONFIGURACIÓN 
     * ============================================================ */
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNynwx8VfnEkSYHQZAeuz2r0CuhenLMtRdnt0iAixk5ic26rPhy1L3m5Sxm4m0GHXv/exec';
        const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mdaqpevw'; // 
        const CACHE_KEY = 'arf_futsal_datos_v1';

        const ORDEN_CATEGORIAS = ['Primera A', 'Reserva A', 'Femenino A', 'Primera B', 'Reserva B'];

        const CATEGORIAS_CON_ASCENSO = ['Primera B'];
        const CATEGORIAS_CON_DESCENSO = ['Primera A', 'Femenino A'];

        // Override manual: cuando un descenso se definió por triangular/desempate
        // en vez de directamente por tabla, se declara acá.
        // clave = "categoria|temporada", valor = array de nombres de equipo (tal
        // cual figuran en la hoja "equipos") que efectivamente descendieron.
        const DESCENSOS_MANUALES = {
            'Femenino A|2025': ['Náutico', 'Unión Central'],
        };

        function tieneDescenso(categoria) {
            return CATEGORIAS_CON_DESCENSO.includes(categoria);
        }

        function tieneAscenso(categoria) {
            return CATEGORIAS_CON_ASCENSO.includes(categoria);
        }

        function temporadaEnCurso(categoria, temporada) {
            return PARTIDOS.some((p) =>
                p.categoria === categoria && String(p.temporada) === String(temporada) &&
                normalizarFase(p.fase) === 'Regular' &&
                normalizarEstado(p.estado) !== 'finalizado'
            );
        }

        function obtenerTemporadasDisponibles(categoriaFiltro) {
            const valores = new Set();
            PARTIDOS.forEach((p) => {
                if (categoriaFiltro && categoriaFiltro !== 'Todas' && p.categoria !== categoriaFiltro) return;
                if (p.temporada != null && p.temporada !== '') valores.add(String(p.temporada));
            });
            return Array.from(valores).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
        }

        function filtrarPorTemporada(lista) {
            const temporada = VISTA_ACTIVA === 'tabla' ? TEMPORADA_TABLA : TEMPORADA_ACTIVA;
            if (!temporada) return lista;
            return lista.filter((item) => String(item.temporada) === String(temporada));
        }

        function normalizarFase(faseRaw) {
            const f = String(faseRaw || '').trim();
            return f === '' ? 'Regular' : f;
        }

        function esFaseDesempate(fase) {
            return /^desempate/i.test(String(fase || ''));
        }

        function resolverCampeonTabla(categoria, temporada, fase) {
            const filas = calcularTabla(categoria, fase, temporada);
            if (!filas.length) return null;

            const idsEnTabla = new Set(filas.map((f) => String(f.id)));
            const desempates = PARTIDOS.filter((p) =>
                p.categoria === categoria && String(p.temporada) === String(temporada) &&
                esFaseDesempate(normalizarFase(p.fase)) &&
                normalizarEstado(p.estado) === 'finalizado' &&
                idsEnTabla.has(String(p.id_local)) && idsEnTabla.has(String(p.id_visitante))
            );

            let campeonId = String(filas[0].id);
            let subcampeonId = filas[1] ? String(filas[1].id) : null;
            let partidoDesempate = null;

            if (desempates.length) {
                const decisivo = desempates[desempates.length - 1];
                const res = determinarGanadorPartido(decisivo);
                if (res.idGanador) {
                    campeonId = res.idGanador;
                    subcampeonId = String(decisivo.id_local) === campeonId ? String(decisivo.id_visitante) : String(decisivo.id_local);
                    partidoDesempate = decisivo;
                }
            }

            return { campeonId, subcampeonId, partidoDesempate };
        }

        function etiquetaJornadaPartido(p) {
            const fase = normalizarFase(p.fase);
            if (fase === 'Regular') return `Fecha ${p.fecha_nro}`;
            if (p.etiqueta_fecha) return String(p.etiqueta_fecha);
            return fase;
        }

        function etiquetaParaJornada(jornada, listaCategoria) {
            return `Fecha ${jornada}`;
        }

        function construirOpcionesJornadas(jornadasDisponibles, jornadaActiva, listaCategoriaCompleta) {
            const grupos = new Map();

            jornadasDisponibles.forEach((j) => {
                const partidosJornada = listaCategoriaCompleta.filter((p) => Number(p.fecha_nro) === j);
                const fasesJornada = [...new Set(partidosJornada.map((p) => normalizarFase(p.fase)))];

                let clave;
                if (fasesJornada.length === 1 && fasesJornada[0] === 'Regular') {
                    clave = 'Regular';
                } else if (fasesJornada.every((f) => esFaseZonaEstricta(f))) {
                    clave = 'Zona Campeonato / Permanencia';
                } else {
                    clave = fasesJornada.find((f) => f !== 'Regular') || fasesJornada[0];
                }

                if (!grupos.has(clave)) grupos.set(clave, []);
                grupos.get(clave).push(j);
            });

            const claves = Array.from(grupos.keys()).sort((a, b) => {
                if (a === 'Regular') return -1;
                if (b === 'Regular') return 1;
                return ordenFaseIndex(a) - ordenFaseIndex(b);
            });

            return claves
                .map((clave) => {
                    const opciones = grupos.get(clave)
                        .map((j) => `<option value="${j}" ${j === jornadaActiva ? 'selected' : ''}>Fecha ${j}</option>`)
                        .join('');
                    return clave === 'Regular' ? opciones : `<optgroup label="${escaparHtml(clave)}">${opciones}</optgroup>`;
                })
                .join('');
        }

        function esFaseZona(fase) {
            return /zona/i.test(fase) || /copa de plata/i.test(fase);
        }

        function esFaseBracket(fase) {
            return /playoff|play\s*off|copa de oro/i.test(fase);
        }

        function ordenFaseIndex(fase) {
            const f = String(fase || '').toLowerCase();
            if (/zona campeonato/.test(f)) return 0;
            if (/zona permanencia/.test(f)) return 1;
            if (/copa de oro/.test(f)) return 2;
            if (/playoff|play\s*off/.test(f)) return 3;
            if (/copa de plata/.test(f)) return 4;
            return 5;
        }

        function clavePartido(p) {
            return [p.categoria, p.temporada, p.fase, p.fecha_nro, p.id_local, p.id_visitante].join('|');
        }

        function analizarRondaBracket(fechaTexto) {
            const t = String(fechaTexto || '').toLowerCase();
            let ronda = 'otra';
            if (t.includes('8vo') || t.includes('octavo')) ronda = 'octavos';
            else if (t.includes('4to') || t.includes('cuarto')) ronda = 'cuartos';
            else if (t.includes('semi')) ronda = 'semifinal';
            else if (t.includes('final')) ronda = 'final';
            return { ronda };
        }

        function determinarGanadorPartido(p) {
            const gl = Number(p.goles_local) || 0;
            const gv = Number(p.goles_visitante) || 0;
            if (gl !== gv) {
                return { idGanador: gl > gv ? String(p.id_local) : String(p.id_visitante), porPenales: false };
            }
            const pl = p.penales_local, pv = p.penales_visitante;
            if (pl !== undefined && pl !== null && pl !== '' && pv !== undefined && pv !== null && pv !== '') {
                const npl = Number(pl), npv = Number(pv);
                if (npl !== npv) {
                    return {
                        idGanador: npl > npv ? String(p.id_local) : String(p.id_visitante),
                        porPenales: true,
                        penalesLocal: npl,
                        penalesVisitante: npv,
                    };
                }
            }
            return { idGanador: null, porPenales: false };
        }

        function generarSelectorTemporada(temporadas) {
            const nav = document.getElementById('tabs-temporada');
            const mostrarEnEstaVista = VISTA_ACTIVA !== 'equipos' && (VISTA_ACTIVA !== 'partidos' || CATEGORIA_ACTIVA !== 'Todas');

            if (temporadas.length <= 1 || !mostrarEnEstaVista) {
                nav.classList.add('hidden');
                nav.innerHTML = '';
                return;
            }

            const temporadaActual = VISTA_ACTIVA === 'tabla' ? TEMPORADA_TABLA : TEMPORADA_ACTIVA;

            nav.classList.remove('hidden');
            nav.innerHTML = `
    <select id="sel-temporada" class="w-full bg-elevado border border-borde rounded-xl px-3 py-2 text-xs font-semibold text-muted">
      ${temporadas.map((t) => `<option value="${t}" ${t === temporadaActual ? 'selected' : ''}>Temporada ${t}</option>`).join('')}
    </select>
  `;
            document.getElementById('sel-temporada').addEventListener('change', (e) => {
                const nuevaTemporada = e.target.value;
                JORNADA_ACTIVA = null;

                if (VISTA_ACTIVA === 'tabla') {
                    TEMPORADA_TABLA = nuevaTemporada;
                } else {
                    TEMPORADA_ACTIVA = nuevaTemporada;
                }

                const categoriasNuevaTemporada = ordenarCategorias([...new Set(filtrarPorTemporada(PARTIDOS).map((p) => p.categoria).filter(Boolean))]);
                if (VISTA_ACTIVA === 'tabla') {
                    if (CATEGORIA_TABLA !== 'Todas' && !categoriasNuevaTemporada.includes(CATEGORIA_TABLA)) {
                        CATEGORIA_TABLA = 'Todas';
                    }
                } else if (CATEGORIA_ACTIVA !== 'Todas' && !categoriasNuevaTemporada.includes(CATEGORIA_ACTIVA)) {
                    CATEGORIA_ACTIVA = 'Todas';
                }

                generarTabsCategorias();
                renderVistaActual();
            });
        }

        function ordenarCategorias(categorias) {
            return [...categorias].sort((a, b) => {
                const ia = ORDEN_CATEGORIAS.indexOf(a);
                const ib = ORDEN_CATEGORIAS.indexOf(b);
                if (ia === -1 && ib === -1) return a.localeCompare(b);
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });
        }

        let CLUB_PERFIL_ACTUAL = null;
        let PERFIL_FILTRO_CATEGORIA = null; // null = todas
        let PERFIL_FILTRO_TEMPORADA = null; // null = todas

        let ADMIN_PIN_ACTUAL = null;

        function calcularTitulosCategoriaTemporada(categoria, temporada) {
            const partidos = PARTIDOS.filter((p) => p.categoria === categoria && String(p.temporada) === String(temporada));
            const fasesPresentes = [...new Set(partidos.map((p) => normalizarFase(p.fase)))];
            const titulos = [];
            const ascensos = [];
            let idAscensoDirecto = null;

            if (tieneAscenso(categoria)) {
                const zc = fasesPresentes.find((f) => /zona campeonato/i.test(f));
                if (zc) {
                    const resuelto = resolverCampeonTabla(categoria, temporada, zc);
                    if (resuelto) {
                        idAscensoDirecto = resuelto.campeonId;
                        ascensos.push({ id: idAscensoDirecto, partidos: resuelto.partidoDesempate ? [resuelto.partidoDesempate] : [] });
                    }
                }
            }

            fasesPresentes.forEach((fase) => {
                if (fase === 'Regular') return;
                if (esFaseDesempate(fase)) return;
                if (esFaseZonaEstricta(fase)) return;

                if (esFaseBracket(fase)) {
                    const partidosFase = partidos.filter((p) => normalizarFase(p.fase) === fase);
                    const porRonda = new Map();
                    partidosFase.forEach((p) => {
                        const { ronda } = analizarRondaBracket(p.etiqueta_fecha || p.fecha_nro);
                        if (!porRonda.has(ronda)) porRonda.set(ronda, []);
                        porRonda.get(ronda).push(p);
                    });
                    const finalPartidos = porRonda.get('final');
                    if (finalPartidos) {
                        const cruces = agruparCruces(finalPartidos);
                        if (cruces.length === 1 && cruces[0].definido) {
                            const c = cruces[0];
                            const campeonId = c.ganadorA ? c.idA : c.idB;
                            const subcampeonId = c.ganadorA ? c.idB : c.idA;
                            const partidosOrdenados = [...c.partidos].sort((a, b) => Number(a.fecha_nro) - Number(b.fecha_nro));

                            const esFasePlayoff = /playoff|play\s*off/i.test(fase);
                            if (esFasePlayoff && tieneAscenso(categoria)) {
                                if (campeonId !== idAscensoDirecto) ascensos.push({ id: campeonId, partidos: partidosOrdenados });
                            } else {
                                titulos.push({ fase, campeonId, subcampeonId, partidos: partidosOrdenados });
                            }
                        }
                    }
                } else {
                    const resuelto = resolverCampeonTabla(categoria, temporada, fase);
                    if (resuelto) {
                        titulos.push({
                            fase,
                            campeonId: resuelto.campeonId,
                            subcampeonId: resuelto.subcampeonId,
                            partidos: resuelto.partidoDesempate ? [resuelto.partidoDesempate] : [],
                        });
                    }
                }
            });

            return { titulos, ascensos };
        }

        function calcularPalmares() {
            const combos = new Set();
            PARTIDOS.forEach((p) => {
                if (p.categoria && p.temporada != null && p.temporada !== '') combos.add(p.categoria + '||' + p.temporada);
            });

            const porClub = new Map();
            function obtenerEntrada(equipo) {
                const clave = claveClub(equipo);
                if (!porClub.has(clave)) {
                    porClub.set(clave, { _clave: clave, nombre: equipo.nombre, url_escudo: equipo.url_escudo, oros: 0, platas: 0, copaPlata: 0, verano: 0, ascensos: 0, descensos: 0, detalle: [] });
                }
                return porClub.get(clave);
            }

            combos.forEach((combo) => {
                const [categoria, temporada] = combo.split('||');
                const { titulos, ascensos } = calcularTitulosCategoriaTemporada(categoria, temporada);

                titulos.forEach((t) => {
                    const esCopaPlata = /copa de plata/i.test(t.fase);
                    const eCampeon = obtenerEntrada(equipoInfo(t.campeonId));

                    if (esCopaPlata) {
                        eCampeon.copaPlata++;
                        eCampeon.detalle.push({ tipo: 'copaplata', categoria, temporada, fase: t.fase, partidos: t.partidos });
                    } else {
                        eCampeon.oros++;
                        eCampeon.detalle.push({ tipo: 'campeon', categoria, temporada, fase: t.fase, partidos: t.partidos });
                        if (t.subcampeonId) {
                            const eSub = obtenerEntrada(equipoInfo(t.subcampeonId));
                            eSub.platas++;
                            eSub.detalle.push({ tipo: 'subcampeon', categoria, temporada, fase: t.fase, partidos: t.partidos });
                        }
                    }
                });

                ascensos.forEach((a) => {
                    const e = obtenerEntrada(equipoInfo(a.id));
                    e.ascensos++;
                    e.detalle.push({ tipo: 'ascenso', categoria, temporada, fase: 'Ascenso', partidos: a.partidos });
                });

                if (tieneDescenso(categoria)) {
                    const fasesZonaEstrictasDeCombo = [...new Set(
                        PARTIDOS.filter((p) => p.categoria === categoria && String(p.temporada) === String(temporada))
                            .map((p) => normalizarFase(p.fase))
                    )].filter((f) => esFaseZonaEstricta(f));

                    if (fasesZonaEstrictasDeCombo.length) {
                        const filasGeneral = calcularTablaMultiFase(categoria, ['Regular', ...fasesZonaEstrictasDeCombo], temporada);
                        const n = Math.min(CANTIDAD_DESCENSO_GENERAL, filasGeneral.length);
                        filasGeneral.slice(filasGeneral.length - n).forEach((f) => {
                            const e = obtenerEntrada(f.equipo);
                            e.descensos++;
                            e.detalle.push({ tipo: 'descenso', categoria, temporada, fase: 'Descenso', partidos: [] });
                        });
                    } else if (!temporadaEnCurso(categoria, temporada)) {
                        const claveOverride = categoria + '|' + temporada;
                        const nombresManual = DESCENSOS_MANUALES[claveOverride];

                        if (nombresManual) {
                            // Descenso definido manualmente (ej. triangular de desempate).
                            const partidosDesempate = PARTIDOS.filter((p) =>
                                p.categoria === categoria && String(p.temporada) === String(temporada) &&
                                /^desempate desc/i.test(normalizarFase(p.fase))
                            );
                            nombresManual.forEach((nombre) => {
                                const equipoEncontrado = EQUIPOS.find((eq) => eq.categoria === categoria && normalizarClub(eq.nombre) === normalizarClub(nombre));
                                if (!equipoEncontrado) return;
                                const e = obtenerEntrada(equipoEncontrado);
                                e.descensos++;
                                e.detalle.push({ tipo: 'descenso', categoria, temporada, fase: 'Descenso', partidos: partidosDesempate });
                            });
                        } else {
                            // Caso normal: últimas posiciones de la Fase Regular (30 fechas).
                            const filasRegular = calcularTabla(categoria, 'Regular', temporada);
                            const n = Math.min(CANTIDAD_DESCENSO_GENERAL, filasRegular.length);
                            filasRegular.slice(filasRegular.length - n).forEach((f) => {
                                const e = obtenerEntrada(f.equipo);
                                e.descensos++;
                                e.detalle.push({ tipo: 'descenso', categoria, temporada, fase: 'Descenso', partidos: [] });
                            });
                        }
                    }
                }
            });

            CAMPEONES_MANUAL.forEach((c) => {
                if (!c.id_club) return;
                const { fase, temporada } = parsearTorneoYAnio(c.torneo_anio);
                const esCopaPlata = /copa de plata/i.test(fase);
                const esVerano = /verano/i.test(fase);
                const equipoSintetico = buscarEquipoPorIdClub(c.id_club) || { id_club: c.id_club, nombre: c.nombre, url_escudo: '' };
                const e = obtenerEntrada(equipoSintetico);

                if (esVerano) {
                    e.verano = (e.verano || 0) + 1;
                    e.detalle.push({ tipo: 'verano', categoria: c.categoria, temporada, fase, partidos: [] });
                } else if (esCopaPlata) {
                    e.copaPlata++;
                    e.detalle.push({ tipo: 'copaplata', categoria: c.categoria, temporada, fase, partidos: [] });
                } else {
                    e.oros++;
                    e.detalle.push({ tipo: 'campeon', categoria: c.categoria, temporada, fase, partidos: [] });
                }
            });

            return porClub;
        }

        function guardarCacheLocal(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ data, guardadoEn: Date.now() }));
            } catch (e) { /* localStorage puede fallar en modo privado; no es crítico */ }
        }

        function leerCacheLocal() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }

        function aplicarDatos(data, esFresco = true) {
            const { equipos, partidos, jugadores } = data;
            CAMPEONES_MANUAL = data.campeonesManual || [];
            AJUSTES_PUNTOS = data.ajustesPuntos || [];
            EQUIPOS = equipos;
            EQUIPOS_POR_ID = new Map(equipos.map((eq) => [String(eq.id_equipo), eq]));
            PARTIDOS = partidos;

            JUGADORES_POR_EQUIPO = new Map();
            (jugadores || []).forEach((j) => {
                const key = String(j.id_equipo);
                if (!JUGADORES_POR_EQUIPO.has(key)) JUGADORES_POR_EQUIPO.set(key, []);
                JUGADORES_POR_EQUIPO.get(key).push(j);
            });

            const temporadas = obtenerTemporadasDisponibles();
            if (!TEMPORADA_ACTIVA || !temporadas.includes(TEMPORADA_ACTIVA)) {
                TEMPORADA_ACTIVA = temporadas[0] || null;
            }
            if (!TEMPORADA_TABLA || !temporadas.includes(TEMPORADA_TABLA)) {
                TEMPORADA_TABLA = temporadas[0] || null;
            }
            generarSelectorTemporada(temporadas);

            generarTabsCategorias();
            renderVistaActual();
            aplicarSponsors(data, esFresco);
        }

        function generarTabsCategorias() {

            const categoriasBase = categoriasDesdePartidos.length
                ? categoriasDesdePartidos
                : [...new Set(filtrarPorTemporada(EQUIPOS).map((e) => e.categoria).filter(Boolean))];

        async function cargarDatos() {
            const cacheLocal = leerCacheLocal();
            const teniaCacheLocal = !!cacheLocal;
            const esPrimeraCarga = PRIMERA_CARGA_PENDIENTE;
            PRIMERA_CARGA_PENDIENTE = false;

            if (teniaCacheLocal) {
                aplicarDatos(cacheLocal.data, false);
                if (!esPrimeraCarga) mostrarBanner('info', 'Actualizando datos…');
            } else {
                mostrarSkeleton();
            }

            if (esPrimeraCarga) {
                mostrarSponsorGrandeInicial();
            }

            try {
                const res = await fetch(APPS_SCRIPT_URL + '?api=1&_=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('http_' + res.status);

                const json = await leerRespuestaConProgreso(res);
                if (!json.ok) throw new Error(json.error || 'error_backend');

                aplicarDatos(json.data, true);
                guardarCacheLocal(json.data);
                ocultarBanner();
                if (SPONSOR_MODAL_BLOQUEADO) completarProgresoSponsor();

                if (typeof json.visitas === 'number') mostrarContadorVisitas(json.visitas);
            } catch (err) {
                console.error('Error cargando datos:', err);
                if (SPONSOR_MODAL_BLOQUEADO) completarProgresoSponsor();

                if (teniaCacheLocal) {
                    const sinConexion = !navigator.onLine || err.message === 'Failed to fetch';
                    mostrarBanner(
                        'error',
                        sinConexion
                            ? '📡 Sin conexión — mostrando los últimos datos guardados.'
                            : '⚠️ No se pudo actualizar — mostrando los últimos datos guardados.'
                    );
                } else {
                    document.getElementById('skeleton').classList.add('hidden');
                    document.getElementById('vista-contenido').classList.add('hidden');
                    document.getElementById('estado-error').classList.remove('hidden');
                }
            }
        }

        function precargarSponsorTemprano() {
            fetch(APPS_SCRIPT_URL + '?hoja=sponsors&_=' + Date.now(), { cache: 'no-store' })
                .then((r) => r.json())
                .then((json) => {
                    if (!json.ok) { SPONSOR_LISTO = true; return; }
                    const lista = (json.data || []).filter((s) => normalizarBooleano(s.activo));
                    SPONSORS = lista;

                    if (!lista.length) {
                        SPONSOR_LISTO = true;
                        completarSiModalEsperando();
                        return;
                    }

                    let pendientes = lista.length;
                    const marcarListo = () => {
                        pendientes--;
                        if (pendientes <= 0) {
                            SPONSOR_LISTO = true;
                            iniciarBannerSponsorFijo();
                            completarSiModalEsperando();
                        }
                    };
                    lista.forEach((s) => {
                        if (!s.imagen_url) { marcarListo(); return; }
                        const img = new Image();
                        img.onload = marcarListo;
                        img.onerror = marcarListo;
                        img.src = s.imagen_url;
                    });
                })
                .catch(() => { SPONSOR_LISTO = true; });
        }

        function completarSiModalEsperando() {

                SPONSOR_MODAL_BLOQUEADO = false;
            }

        async function leerRespuestaConProgreso(res) {
            const totalHeader = res.headers.get('Content-Length');
            const total = totalHeader ? Number(totalHeader) : 0;

            if (!res.body || !total) {
                // El navegador no nos da tamaño total (pasa seguido con Apps Script,
                // que no siempre manda Content-Length) — seguimos con la simulación
                // hasta 92%, igual que antes, y cerramos al terminar.
                return res.json();
            }

            detenerProgresoSimulado();

            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let recibido = 0;
            let textoCompleto = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                recibido += value.length;
                textoCompleto += decoder.decode(value, { stream: true });
                if (SPONSOR_MODAL_BLOQUEADO) {
                    const pct = Math.min(99, Math.round((recibido / total) * 100));
                    SPONSOR_PROGRESO_PORCENTAJE = pct;
                    actualizarProgresoSponsorUI();
                }
            }

            return JSON.parse(textoCompleto);
        }

        function renderVistaActual() {

        /* ============================================================

        function obtenerJornadasDisponibles(lista) {
            const jornadas = lista
                .map((p) => p.fecha_nro)
                .filter((f) => f !== null && f !== undefined && f !== '');
            return Array.from(new Set(jornadas.map(Number))).sort((a, b) => a - b);
        }

        function elegirJornadaPorDefecto(jornadas, lista) {
            if (!jornadas.length) return null;
            const hoyStr = new Date().toISOString().slice(0, 10);

            const conPendientes = jornadas.filter((j) =>
                lista.some(
                    (p) =>
                        Number(p.fecha_nro) === j &&
                        (!p.fecha || p.fecha >= hoyStr) &&
                        normalizarEstado(p.estado) !== 'finalizado'
                )
            );
            if (conPendientes.length) return conPendientes[0];

            return jornadas[jornadas.length - 1];
        }

        function seleccionarPartidosPorFechaMasProxima(partidos) {
            const hoyStr = new Date().toISOString().slice(0, 10);
            const conFecha = partidos.filter((p) => p.fecha);
            if (!conFecha.length) return partidos;

            const fechasPendientes = [...new Set(
                conFecha
                    .filter((p) => normalizarEstado(p.estado) !== 'finalizado' && p.fecha >= hoyStr)
                    .map((p) => p.fecha)
            )].sort();

            let fechaElegida;
            if (fechasPendientes.length) {
                fechaElegida = fechasPendientes[0];
            } else {
                const fechasJugadas = [...new Set(conFecha.map((p) => p.fecha))].sort();
                fechaElegida = fechasJugadas[fechasJugadas.length - 1];
            }

            return partidos.filter((p) => p.fecha === fechaElegida);
        }

        function renderPartidos() {

      <button onclick="cambiarFiltroPartidos('favoritos')" class="text-xs font-semibold px-3 py-1.5 rounded-full border ${VISTA_PARTIDOS_FILTRO === 'favoritos' ? 'bg-accent text-cancha border-accent' : 'bg-transparent text-muted border-borde'}">★ Mis equipos</button>

            if (CATEGORIA_ACTIVA === 'Todas') {

                contenedor.innerHTML = chips + tip + fijados + (destacados || (fijados ? '' : `<p class="text-center text-muted text-sm py-16">Todavía no hay partidos programados.</p>`));
                actualizarContadorVivos(enVivoFijados);

            const partidosTemporada = filtrarPorTemporada(PARTIDOS).filter((p) => {

                return fase === 'Regular' || esFaseZonaEstricta(fase);

            const filtradosPorCategoria = partidosTemporada.filter((p) => p.categoria === CATEGORIA_ACTIVA);

                JORNADA_ACTIVA = elegirJornadaPorDefecto(jornadasDisponibles, filtradosPorCategoria);
            }

            const partidosDeLaJornada = filtradosPorCategoria.filter((p) => Number(p.fecha_nro) === JORNADA_ACTIVA);

        function pintarListaPartidos(lista, jornadaActiva, jornadasDisponibles, listaCategoriaCompleta, chips) {

            const encabezado =

            let listaFiltrada = lista;

                listaFiltrada = lista.filter((p) => normalizarEstado(p.estado) !== 'finalizado');

    <article class="bg-surface border border-borde rounded-2xl px-3 py-3 ${clickable ? 'cursor-pointer active:opacity-70' : ''}"
      ${clickable ? `data-h2h-local="${partido.id_local}" data-h2h-visitante="${partido.id_visitante}"` : ''}>
      ${estado === 'vivo' ? `<div class="flex items-center gap-1.5 mb-1.5"><span class="w-1.5 h-1.5 rounded-full bg-live punto-vivo"></span><span class="text-[9px] font-bold text-live uppercase">En vivo</span></div>` : ''}
      <div class="flex items-center gap-2">
        <img src="${local.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(local.nombre)}');" class="w-6 h-6 rounded-full object-cover bg-elevado flex-shrink-0"/>
        <span class="text-xs truncate flex-1">${escaparHtml(local.nombre)}</span>
        <span class="font-mono text-sm font-semibold flex-shrink-0 ${mostrarGol ? 'text-texto' : 'text-muted'}">${mostrarGol ? partido.goles_local ?? 0 : '-'}</span>
        <span class="text-muted text-xs flex-shrink-0">-</span>
        <span class="font-mono text-sm font-semibold flex-shrink-0 ${mostrarGol ? 'text-texto' : 'text-muted'}">${mostrarGol ? partido.goles_visitante ?? 0 : '-'}</span>
        <span class="text-xs truncate flex-1 text-right">${escaparHtml(visitante.nombre)}</span>
        <img src="${visitante.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(visitante.nombre)}');" class="w-6 h-6 rounded-full object-cover bg-elevado flex-shrink-0"/>
      </div>
    </article>
  `;
        }

        function pillEstado(estado, fechaTexto) {
            const sufijo = fechaTexto ? ` ${fechaTexto}` : '';
            const variantes = {
                vivo: `<span class="flex items-center gap-1.5 bg-live/10 text-live text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full">
             <span class="w-1.5 h-1.5 rounded-full bg-live punto-vivo"></span> En vivo${sufijo}
           </span>`,
                finalizado: `<span class="bg-elevado text-muted text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full">Finalizado${sufijo}</span>`,
                programado: `<span class="bg-accent/10 text-accent text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full">Programado${sufijo}</span>`,
            };
            return variantes[estado] || variantes.programado;
        }

        function agruparPartidosPorContexto(lista, incluirCategoria) {
            const ordenada = [...lista].sort((a, b) => {
                const porFecha = String(a.fecha || '').localeCompare(String(b.fecha || ''));
                if (porFecha !== 0) return porFecha;
                return Number(a.fecha_nro) - Number(b.fecha_nro);
            });

            const grupos = [];
            ordenada.forEach((p) => {
                const clave = (incluirCategoria ? p.categoria + '|' : '') + p.fecha_nro + '|' + p.fecha;
                const ultimo = grupos[grupos.length - 1];
                if (ultimo && ultimo.clave === clave) {
                    ultimo.partidos.push(p);
                } else {
                    grupos.push({ clave, categoria: p.categoria, fecha_nro: p.fecha_nro, fecha: p.fecha, partidos: [p] });
                }
            });
            return grupos;
        }

        function contextoHeaderHtml(grupo) {
            const etiqueta = etiquetaJornadaPartido(grupo.partidos[0]);
            const fechaTexto = formatearFechaVisual(grupo.fecha);
            const hoyStr = new Date().toISOString().slice(0, 10);
            const esHoy = grupo.fecha === hoyStr;

            return `
    <div class="flex items-center justify-between mb-1.5 px-0.5 mt-3">
      <span class="text-[10px] text-muted">${escaparHtml(etiqueta)}</span>
      ${fechaTexto ? `<span class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full ${esHoy ? 'bg-accent text-cancha' : 'bg-elevado text-texto'}">${fechaTexto}</span>` : ''}
    </div>
  `;
        }

        function renderGruposPartidos(lista) {
            const grupos = agruparPartidosPorContexto(lista, false);
            return grupos
                .map((g) => `
      ${contextoHeaderHtml(g)}
      <div class="space-y-2">${g.partidos.map((p) => filaCompactaPartido(p)).join('')}</div>
    `)
                .join('');
        }

        function renderPaginaAgrupadaPorCategoria(items) {
            const bloques = [];
            items.forEach((p) => {
                const ultimo = bloques[bloques.length - 1];
                if (ultimo && ultimo.categoria === p.categoria) ultimo.partidos.push(p);
                else bloques.push({ categoria: p.categoria, partidos: [p] });
            });
            return bloques
                .map((b) => `
      <h3 class="text-xs font-semibold text-texto uppercase tracking-wide px-1 mb-1.5 mt-3">${escaparHtml(b.categoria)}</h3>
      ${renderGruposPartidos(b.partidos)}
    `)
                .join('');
        }

        function paginarConGrupos(lista, pagina, incluirCategoria, idPrefijo) {
            const totalPaginas = Math.max(1, Math.ceil(lista.length / FAVORITOS_POR_PAGINA));
            const paginaSegura = Math.min(Math.max(pagina, 0), totalPaginas - 1);
            const inicio = paginaSegura * FAVORITOS_POR_PAGINA;
            const items = lista.slice(inicio, inicio + FAVORITOS_POR_PAGINA);

            const cuerpo = incluirCategoria ? renderPaginaAgrupadaPorCategoria(items) : renderGruposPartidos(items);

            const paginacion = totalPaginas > 1 ? `
    <div class="flex items-center justify-between mt-3 mb-2">
      <button onclick="cambiarPaginaFavoritos('${idPrefijo}', -1)" class="p-1.5 text-muted disabled:opacity-25" ${paginaSegura <= 0 ? 'disabled' : ''}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="text-[10px] text-muted uppercase">Página ${paginaSegura + 1} de ${totalPaginas}</span>
      <button onclick="cambiarPaginaFavoritos('${idPrefijo}', 1)" class="p-1.5 text-muted disabled:opacity-25" ${paginaSegura >= totalPaginas - 1 ? 'disabled' : ''}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  ` : '';

            return cuerpo + paginacion;
        }

        /* ============================================================
         *  VISTA: TABLA DE POSICIONES COMPLETA
         * ============================================================ */
        function calcularTabla(categoria, fase, temporadaOverride) {
            const faseObjetivo = fase || 'Regular';
            const partidosTemporada = temporadaOverride !== undefined
                ? PARTIDOS.filter((p) => String(p.temporada) === String(temporadaOverride))
                : filtrarPorTemporada(PARTIDOS);

            const finalizados = partidosTemporada.filter(
                (p) => p.categoria === categoria &&
                    normalizarEstado(p.estado) === 'finalizado' &&
                    normalizarFase(p.fase) === faseObjetivo
            );

            const stats = new Map();
            function obtenerStats(id) {
                if (!stats.has(id)) stats.set(id, { pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0 });
                return stats.get(id);
            }

            finalizados.forEach((p) => {
                const local = obtenerStats(String(p.id_local));
                const visita = obtenerStats(String(p.id_visitante));
                const gl = Number(p.goles_local) || 0;
                const gv = Number(p.goles_visitante) || 0;

                local.pj++; visita.pj++;
                local.gf += gl; local.gc += gv;
                visita.gf += gv; visita.gc += gl;

                if (gl > gv) { local.pg++; visita.pp++; }
                else if (gl < gv) { visita.pg++; local.pp++; }
                else { local.pe++; visita.pe++; }
            });

            const filas = Array.from(stats.entries()).map(([id, s]) => {
                const dif = s.gf - s.gc;
                const pts = s.pg * 3 + s.pe;
                return { equipo: equipoInfo(id), id, ...s, dif, pts };
            });

            const temporadaParaAjustes = temporadaOverride !== undefined ? temporadaOverride : TEMPORADA_TABLA;
            const ajustesAplicables = AJUSTES_PUNTOS.filter((a) =>
                a.categoria === categoria && String(a.temporada) === String(temporadaParaAjustes)
            );
            ajustesAplicables.forEach((a) => {
                const fila = filas.find((f) => String(f.id) === String(a.id_equipo));
                if (fila) fila.pts += Number(a.puntos) || 0;
            });

            filas.sort((a, b) => b.pts - a.pts || b.dif - a.dif || b.gf - a.gf);
            return filas;
        }

        let DESTACADOS_EXPANDIDOS = new Set();

        function calcularDestacadosPorCategoria() {
            const categorias = ordenarCategorias([...new Set(filtrarPorTemporada(EQUIPOS).map((e) => e.categoria))]);
            const resultado = [];

            categorias.forEach((cat) => {
                const partidosCat = filtrarPorTemporada(PARTIDOS).filter((p) => p.categoria === cat && normalizarFase(p.fase) === 'Regular');
                if (!partidosCat.length) return;

                const partidosDelDia = seleccionarPartidosPorFechaMasProxima(partidosCat)
                    .sort((a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')) || Number(a.fecha_nro) - Number(b.fecha_nro));

                if (!partidosDelDia.length) return;

                // "Ver todos" muestra la JORNADA completa (Fecha 19 entera), no solo
                // los partidos de ese día calendario puntual.
                const fechasNroDelDia = [...new Set(partidosDelDia.map((p) => Number(p.fecha_nro)))];
                const todosDeLaJornada = partidosCat
                    .filter((p) => fechasNroDelDia.includes(Number(p.fecha_nro)))
                    .sort((a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')) || Number(a.fecha_nro) - Number(b.fecha_nro));

                const pendientes = partidosDelDia.filter((p) => normalizarEstado(p.estado) !== 'finalizado');
                const baseParaTop = pendientes.length ? pendientes : partidosDelDia;

                const tabla = calcularTabla(cat, 'Regular');
                const posicionPorId = new Map();
                tabla.forEach((f, i) => posicionPorId.set(String(f.id), i + 1));

                const conScore = baseParaTop
                    .filter((p) => posicionPorId.has(String(p.id_local)) && posicionPorId.has(String(p.id_visitante)))
                    .map((p) => ({ partido: p, score: posicionPorId.get(String(p.id_local)) + posicionPorId.get(String(p.id_visitante)) }))
                    .sort((a, b) => a.score - b.score);

                if (!conScore.length) return;

                const topOrdenadosPorFecha = conScore
                    .slice(0, 3)
                    .map((x) => x.partido)
                    .sort((a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')) || Number(a.fecha_nro) - Number(b.fecha_nro));

                resultado.push({
                    categoria: cat,
                    top: topOrdenadosPorFecha,
                    todos: todosDeLaJornada,
                    etiquetaJornada: etiquetaJornadaPartido(partidosDelDia[0]),
                });
            });

            return resultado;
        }

        function toggleDestacadosCategoria(cat) {
            if (DESTACADOS_EXPANDIDOS.has(cat)) DESTACADOS_EXPANDIDOS.delete(cat);
            else DESTACADOS_EXPANDIDOS.add(cat);
            renderPartidos();
        }

        function bloqueDestacados() {
            const grupos = calcularDestacadosPorCategoria();
            if (!grupos.length) return '';

            let html = '';

            grupos.forEach((g) => {
                const expandido = DESTACADOS_EXPANDIDOS.has(g.categoria);
                const lista = expandido ? g.todos : g.top;
                const hayMas = g.todos.length > g.top.length;

                html += `
      <h3 class="text-xs font-semibold text-texto uppercase tracking-wide px-1 mb-1.5 mt-3">${escaparHtml(g.categoria)}</h3>
      <div class="${expandido ? 'destacados-in' : ''}">${renderGruposPartidos(lista)}</div>
      ${hayMas ? `<button onclick="toggleDestacadosCategoria('${escaparHtml(g.categoria)}')" class="w-full text-center text-[11px] font-semibold text-accent uppercase tracking-wide mt-2 mb-1 py-1 transition-transform active:scale-95">${expandido ? 'Ver menos' : 'Ver todos los partidos de la ' + escaparHtml(g.etiquetaJornada)}</button>` : ''}
    `;
            });

            return html + `<div class="h-2"></div>`;
        }

        function calcularPartidosFijados() {
            return filtrarPorTemporada(PARTIDOS)
                .filter((p) => normalizarBooleano(p.destacado) && normalizarEstado(p.estado) !== 'finalizado')
                .sort((a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')));
        }

        function bloquePartidosFijados() {
            const fijados = calcularPartidosFijados();
            if (!fijados.length) return '';
            return `
    <h3 class="text-xs font-semibold text-accent uppercase tracking-wide px-1 mb-1.5">📌 Partido importante</h3>
    ${renderGruposPartidos(fijados)}
    <div class="h-1"></div>
  `;
        }

        function cambiarFiltroPartidos(valor) {
            VISTA_PARTIDOS_FILTRO = valor;
            renderPartidos();
        }

        function cambiarFiltroEstadoFavoritos(valor) {
            FAVORITOS_ESTADO_FILTRO = valor;
            FAVORITOS_PAGINA = 0;
            renderPartidos();
        }

        function renderPartidosFavoritos(chips) {
            const contenedor = document.getElementById('vista-contenido');

            let partidosBase = filtrarPorTemporada(PARTIDOS).filter((p) => normalizarFase(p.fase) === 'Regular');
            if (CATEGORIA_ACTIVA !== 'Todas') {
                partidosBase = partidosBase.filter((p) => p.categoria === CATEGORIA_ACTIVA);
            }

            const partidosFavoritos = partidosBase.filter((p) => {
                const clubLocal = claveClub(equipoInfo(p.id_local));
                const clubVisitante = claveClub(equipoInfo(p.id_visitante));
                return FAVORITOS.has(clubLocal) || FAVORITOS.has(clubVisitante);
            });

            const incluirCategoria = CATEGORIA_ACTIVA === 'Todas';

            const subChips = `
    <div class="flex gap-2 mb-3">
      <button onclick="cambiarFiltroEstadoFavoritos('programados')" class="text-[11px] font-semibold px-2.5 py-1 rounded-full border ${FAVORITOS_ESTADO_FILTRO === 'programados' ? 'bg-accent text-cancha border-accent' : 'bg-transparent text-muted border-borde'}">Programados</button>
      <button onclick="cambiarFiltroEstadoFavoritos('finalizados')" class="text-[11px] font-semibold px-2.5 py-1 rounded-full border ${FAVORITOS_ESTADO_FILTRO === 'finalizados' ? 'bg-accent text-cancha border-accent' : 'bg-transparent text-muted border-borde'}">Finalizados</button>
      <button onclick="cambiarFiltroEstadoFavoritos('todos')" class="text-[11px] font-semibold px-2.5 py-1 rounded-full border ${FAVORITOS_ESTADO_FILTRO === 'todos' ? 'bg-accent text-cancha border-accent' : 'bg-transparent text-muted border-borde'}">Ver todos</button>
    </div>
  `;

            let listaHtml = '';
            let cantidadEnVivo = 0;

            if (FAVORITOS_ESTADO_FILTRO === 'todos') {
                const pendientes = partidosFavoritos
                    .filter((p) => normalizarEstado(p.estado) !== 'finalizado')
                    .sort((a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')));
                const finalizados = partidosFavoritos
                    .filter((p) => normalizarEstado(p.estado) === 'finalizado')
                    .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
                cantidadEnVivo = pendientes.filter((p) => normalizarEstado(p.estado) === 'vivo').length;

                if (pendientes.length) {
                    listaHtml += `<p class="text-[10px] text-muted uppercase tracking-wide px-1">Próximos</p>${paginarConGrupos(pendientes, FAVORITOS_PAGINA, incluirCategoria, 'proximos')}`;
                }
                if (finalizados.length) {
                    listaHtml += `<p class="text-[10px] text-muted uppercase tracking-wide px-1 mt-3">Resultados</p>${paginarConGrupos(finalizados, FAVORITOS_PAGINA, incluirCategoria, 'resultados')}`;
                }
                if (!pendientes.length && !finalizados.length) {
                    listaHtml = `<p class="text-center text-muted text-sm py-16">No hay partidos para tus equipos favoritos.</p>`;
                }
            } else {
                const esFinalizados = FAVORITOS_ESTADO_FILTRO === 'finalizados';
                const lista = partidosFavoritos
                    .filter((p) => (normalizarEstado(p.estado) === 'finalizado') === esFinalizados)
                    .sort((a, b) => esFinalizados
                        ? String(b.fecha || '').localeCompare(String(a.fecha || ''))
                        : String(a.fecha || '').localeCompare(String(b.fecha || '')));
                cantidadEnVivo = lista.filter((p) => normalizarEstado(p.estado) === 'vivo').length;
                listaHtml = lista.length
                    ? paginarConGrupos(lista, FAVORITOS_PAGINA, incluirCategoria, 'lista')
                    : `<p class="text-center text-muted text-sm py-16">No hay partidos ${esFinalizados ? 'finalizados' : 'programados'} para tus equipos favoritos.</p>`;
            }

            actualizarContadorVivos(cantidadEnVivo);
            contenedor.innerHTML = chips + subChips + listaHtml;
        }

        function renderTabla() {
            const contenedor = document.getElementById('vista-contenido');

            const partidosTemporadaTabla = filtrarPorTemporada(PARTIDOS);
            const categoriaParaTabla = CATEGORIA_TABLA === 'Todas'
                ? (ordenarCategorias([...new Set(partidosTemporadaTabla.map((p) => p.categoria).filter(Boolean))])[0] || null)
                : CATEGORIA_TABLA;

            if (!categoriaParaTabla) {
                contenedor.innerHTML = `<p class="text-center text-muted text-sm py-16">No hay categorías cargadas.</p>`;
                return;
            }

            const aviso = CATEGORIA_TABLA === 'Todas'
                ? `<p class="text-[11px] text-muted mb-2 px-1">Mostrando ${escaparHtml(categoriaParaTabla)} — elegí otra categoría arriba para cambiar.</p>`
                : '';

            const tip = tipOnboarding('tabla', 'Clickeá un equipo para ver sus últimos 5 resultados.');

            const partidosCategoria = filtrarPorTemporada(PARTIDOS).filter((p) => p.categoria === categoriaParaTabla);
            const fasesPresentes = [...new Set(partidosCategoria.map((p) => normalizarFase(p.fase)))];
            const fasesOrdenables = fasesPresentes
                .filter((f) => f !== 'Regular' && !esFaseDesempate(f))
                .sort((a, b) => ordenFaseIndex(a) - ordenFaseIndex(b));

            const bloques = [{ fase: 'Regular', titulo: fasesPresentes.length > 1 ? 'Fase Regular' : null, esBracket: false }];
            fasesOrdenables.forEach((f) => {
                bloques.push(esFaseBracket(f) ? { fase: f, esBracket: true } : { fase: f, titulo: f, esBracket: false });
            });
            bloques.forEach((b) => {
                if (!b.esBracket) {
                    b.filas = calcularTabla(categoriaParaTabla, b.fase);
                    b.ids = new Set(b.filas.map((f) => String(f.id)));
                }
            });

            const desempatesDisponibles = partidosCategoria.filter(
                (p) => esFaseDesempate(normalizarFase(p.fase)) && !/^desempate desc/i.test(normalizarFase(p.fase)) && normalizarEstado(p.estado) === 'finalizado'
            );
            const asignaciones = new Map();
            const sinAsignar = [];

            desempatesDisponibles.forEach((p) => {
                let mejorIdx = -1, mejorSize = Infinity;
                bloques.forEach((b, idx) => {
                    if (b.esBracket || !b.filas.length) return;
                    if (b.ids.has(String(p.id_local)) && b.ids.has(String(p.id_visitante)) && b.ids.size < mejorSize) {
                        mejorSize = b.ids.size;
                        mejorIdx = idx;
                    }
                });
                if (mejorIdx !== -1) {
                    if (!asignaciones.has(mejorIdx)) asignaciones.set(mejorIdx, []);
                    asignaciones.get(mejorIdx).push(p);
                } else {
                    sinAsignar.push(p);
                }
            });

            // Captions de clasificación — calculadas con datos reales, no hardcodeadas.
            const zc = bloques.find((b) => !b.esBracket && /zona campeonato/i.test(b.fase));
            const zp = bloques.find((b) => !b.esBracket && /zona permanencia/i.test(b.fase));
            const debeDescensoEnRegular = !zc && !zp && tieneDescenso(categoriaParaTabla);

            let captionRegular = '';
            if (zc && zp) {
                const nZC = zc.filas.length;
                const nZP = zp.filas.length;
                captionRegular = `<p class="text-[10px] text-muted px-1 mt-1.5 mb-1">Posiciones 1 a ${nZC} clasifican a ${escaparHtml(zc.fase)} · Posiciones ${nZC + 1} a ${nZC + nZP} clasifican a ${escaparHtml(zp.fase)}.</p>`;
            }

            let captionZC = '';
            if (zc) {
                const participantes = obtenerParticipantesPlayoff(categoriaParaTabla);
                if (participantes.length) {
                    const idsZC = new Set(zc.filas.map((f) => String(f.id)));
                    const idsZP = zp ? new Set(zp.filas.map((f) => String(f.id))) : new Set();
                    const desdeZC = participantes.filter((id) => idsZC.has(id)).length;
                    const desdeZP = participantes.filter((id) => idsZP.has(id)).length;
                    if (desdeZC > 0) {
                        let texto = `Posiciones 1 a ${desdeZC} clasifican a Playoff`;
                        if (desdeZP > 0 && zp) texto += `, junto con ${desdeZP === 1 ? 'el 1°' : 'los primeros ' + desdeZP} de ${escaparHtml(zp.fase)}`;
                        texto += '.';
                        captionZC = `<p class="text-[10px] text-muted px-1 mt-1.5 mb-1">${texto}</p>`;
                    }
                }
            }

            let huboContenido = false;
            let html = tip + aviso;

            bloques.forEach((b, idx) => {
                if (b.esBracket) {
                    html += renderBracketFase(categoriaParaTabla, b.fase);
                    huboContenido = true;
                    return;
                }
                if (!b.filas.length) return;
                huboContenido = true;
                const umbralRegular = (b.fase === 'Regular' && debeDescensoEnRegular)
                    ? b.filas.length - Math.min(CANTIDAD_DESCENSO_GENERAL, b.filas.length)
                    : undefined;
                const enCurso = b.fase === 'Regular' && temporadaEnCurso(categoriaParaTabla, TEMPORADA_TABLA);
                html += bloqueTablaFase(b.titulo, b.filas, b.fase, asignaciones.get(idx) || [], umbralRegular, enCurso, categoriaParaTabla, TEMPORADA_TABLA);

                if (b.fase === 'Regular' && umbralRegular != null) {
                    const claveOverride = categoriaParaTabla + '|' + TEMPORADA_TABLA;
                    const equiposOverride = DESCENSOS_MANUALES[claveOverride];
                    if (equiposOverride) {
                        html += `<p class="text-[10px] text-live px-1 mb-3">Se jugó un triangular por igualdad de puntos — el descenso restante fue de ${escaparHtml(equiposOverride.join(', '))}.</p>`;
                    }
                }
                if (b.fase === 'Regular' && captionRegular) html += captionRegular;
                if (zc && b.fase === zc.fase && captionZC) html += captionZC;
            });

            if (sinAsignar.length) {
                html += `
      <h3 class="text-xs font-semibold text-texto uppercase tracking-wide px-1 mt-4 mb-2">Desempate</h3>

            const fasesZonaEstrictas = fasesOrdenables.filter((f) => esFaseZonaEstricta(f));
            const bloqueGeneral = bloqueTablaGeneral(categoriaParaTabla, fasesZonaEstrictas);
            if (bloqueGeneral) { html += bloqueGeneral; huboContenido = true; }

            if (!huboContenido) {
                html += `<p class="text-center text-muted text-sm py-16">Todavía no hay partidos finalizados en esta categoría.</p>`;
            }

        }

        function tablaHtml(filas, umbralDescenso) {
            return `
    <div class="bg-surface border border-borde rounded-2xl overflow-hidden mb-2">

        <thead>

        function bloqueTablaFase(titulo, filas, fase, desempates, umbralDescenso, enCurso, categoriaFase, temporadaFase) {
            let extra = '';
            let campeonId = null;

            if (desempates && desempates.length) {

    `;
            }

            const coronaCampeon = /copa de plata/i.test(fase);
            if (coronaCampeon) {
                if (!campeonId) campeonId = String(filas[0].id);
                const ganador = equipoInfo(campeonId);
                extra += `
      <div class="bg-accent/10 border border-accent/30 rounded-2xl px-4 py-3 mb-2 flex items-center gap-3">
        <span class="text-2xl">🏆</span>

      </div>

            } else if (campeonId) {
                const ganador = equipoInfo(campeonId);
                extra += `
      <div class="bg-accent/10 border border-accent/30 rounded-2xl px-4 py-3 mb-2 flex items-center gap-3">
        <span class="text-2xl">🏆</span>
        <p class="text-sm font-semibold text-texto">Gana el desempate: ${escaparHtml(ganador.nombre)}</p>
      </div>
    `;
            }

            const captionDescenso = umbralDescenso != null
                ? `<p class="text-[10px] text-live px-1 mt-1.5 mb-1">Últimas ${filas.length - umbralDescenso} posiciones: ${enCurso ? 'en puestos de descenso' : 'descenso'}.</p>`
                : '';

            const ajustesDeEstaFase = AJUSTES_PUNTOS.filter((a) =>
                a.categoria === arguments[6] && String(a.temporada) === String(arguments[7]) &&
                filas.some((f) => String(f.id) === String(a.id_equipo))
            );
            const captionAjustes = ajustesDeEstaFase.length
                ? ajustesDeEstaFase.map((a) => {
                    const eq = equipoInfo(a.id_equipo);
                    const signo = Number(a.puntos) >= 0 ? '+' : '';
                    return `<p class="text-[10px] text-warning px-1 mt-1">${escaparHtml(eq.nombre)}: ${signo}${a.puntos} pts${a.motivo ? ' — ' + escaparHtml(a.motivo) : ''}</p>`;
                }).join('')
                : '';

            return `
    ${titulo ? `<h3 class="text-xs font-semibold text-texto uppercase tracking-wide px-1 mt-4 mb-2">${escaparHtml(titulo)}</h3>` : ''}
    ${tablaHtml(filas, umbralDescenso)}
    ${captionDescenso}
    ${captionAjustes}
    ${extra}
  `;
        }



        function tarjetaDesempate(p) {
            const local = equipoInfo(p.id_local);
            const visitante = equipoInfo(p.id_visitante);
            const res = determinarGanadorPartido(p);
            const ganadorEsLocal = res.idGanador === String(p.id_local);
            const ganadorEsVisitante = res.idGanador === String(p.id_visitante);

            return `
    <div class="bg-surface border border-borde rounded-xl px-3 py-2.5">
      <div class="flex items-center justify-between text-xs mb-1.5">
        <div class="flex items-center gap-1.5 min-w-0 ${res.idGanador && !ganadorEsLocal ? 'opacity-60' : ''}">
          <img src="${local.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(local.nombre)}');" class="w-5 h-5 rounded-full object-cover bg-elevado flex-shrink-0"/>
          <span class="truncate ${ganadorEsLocal ? 'font-semibold text-texto' : 'text-muted'}">${escaparHtml(local.nombre)}</span>
        </div>
        <span class="font-mono font-semibold flex-shrink-0 px-2">${Number(p.goles_local) || 0}</span>
      </div>
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5 min-w-0 ${res.idGanador && !ganadorEsVisitante ? 'opacity-60' : ''}">
          <img src="${visitante.url_escudo || ''}" onerror="this.onerror=null; this.src=escudoPorDefecto('${escaparHtml(visitante.nombre)}');" class="w-5 h-5 rounded-full object-cover bg-elevado flex-shrink-0"/>
          <span class="truncate ${ganadorEsVisitante ? 'font-semibold text-texto' : 'text-muted'}">${escaparHtml(visitante.nombre)}</span>
        </div>
        <span class="font-mono font-semibold flex-shrink-0 px-2">${Number(p.goles_visitante) || 0}</span>
      </div>
      ${res.porPenales ? `<p class="text-[9px] text-muted text-center mt-1.5">Definido por penales ${res.penalesLocal}-${res.penalesVisitante}</p>` : ''}
